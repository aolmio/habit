<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Trailmark — Quest Habit Tracker</title>
<meta name="description" content="Turn habits into quests, protect streaks with Magic Shields, and celebrate every milestone.">
<meta name="theme-color" content="#FF6FA0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trailmark">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght=400;500;600;700&family=Nunito:wght=400;600;700;800;900&family=JetBrains+Mono:wght=600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { display: ['Fredoka','sans-serif'], body: ['Nunito','sans-serif'], mono: ['JetBrains Mono','monospace'] },
      colors: {
        brand: {
          bgStart: '#FFDEE9', bgEnd: '#B5FFFC',
          panel: 'rgba(255, 255, 255, 0.45)',
          ink: '#2D1F47', muted: '#6B5B95', line: 'rgba(255, 255, 255, 0.6)',
          purple: '#9B5DE5', purpleSoft: 'rgba(155, 93, 229, 0.15)',
          pink: '#F15BB5', pinkSoft: 'rgba(241, 91, 181, 0.15)',
          blue: '#00BBF9', blueSoft: 'rgba(0, 187, 249, 0.15)',
          green: '#00F5D4', greenSoft: 'rgba(0, 245, 212, 0.15)',
          yellow: '#FEE440', yellowSoft: 'rgba(244, 228, 64, 0.25)',
          orange: '#FF8A5B', orangeSoft: 'rgba(255, 138, 91, 0.15)',
          red: '#FF4D6D', redSoft: 'rgba(255, 77, 109, 0.15)',
          shield: '#33D2FF', shieldSoft: 'rgba(51, 210, 255, 0.2)'
        }
      },
      borderRadius: { '3xl':'2rem', '4xl':'2.5rem', '5xl':'3rem' },
      boxShadow: {
        bento: '0 8px 32px 0 rgba(155, 93, 229, 0.08), inset 0 2px 4px 0 rgba(255, 255, 255, 0.40)',
        pop: '0 8px 0 0 #2D1F47',
        float: '0 20px 40px -10px rgba(45, 31, 71, 0.2)'
      }
    }
  }
}
</script>
<style>
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
* { -webkit-tap-highlight-color: transparent; outline: none !important; box-sizing: border-box; }
html, body {
  background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
  background-attachment: fixed;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}
body {
  font-family: 'Nunito', sans-serif;
  overscroll-behavior-y: none;
  color: #2D1F47;
}
.font-display { font-family: 'Fredoka', sans-serif; }
.font-num { font-family: 'Fredoka', sans-serif; font-variant-numeric: tabular-nums; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.safe-pb { padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 16px); }
.content-safe-pb { padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 100px); }
@supports (-webkit-touch-callout: none) {
  .safe-pt { padding-top: calc(var(--sat) + 1rem) !important; }
  .safe-pt-sm { padding-top: calc(var(--sat) + 0.5rem) !important; }
  @media (max-width: 767px) {
    .safe-pl { padding-left: calc(var(--sal) + 1rem) !important; }
    .safe-pr { padding-right: calc(var(--sar) + 1rem) !important; }
  }
  #achievement { top: calc(var(--sat) + 6rem); }
  @media (min-width: 768px) {
    #achievement { top: calc(var(--sat) + 2rem); }
  }
}
button, a, [role="button"] { touch-action: manipulation; }
button, a, [role="button"], input, select, textarea { -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
.bubble-bg {
  position: absolute;
  border-radius: 50%;
  filter: blur(50px);
  z-index: 0;
  opacity: 0.6;
  pointer-events: none;
  animation: floatBg 15s ease-in-out infinite alternate;
}
@keyframes floatBg {
  0% { transform: translateY(0px) scale(1); }
  100% { transform: translateY(-50px) scale(1.1); }
}
.glass-card {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.8);
  box-shadow: 0 12px 32px 0 rgba(45, 31, 71, 0.05);
}
.glass-panel {
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-right: 1px solid rgba(255, 255, 255, 0.6);
}
.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  animation: shoot 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}
@keyframes shoot {
  0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(270deg); opacity: 0; }
}
.confetti {
  position: fixed;
  top: 50%;
  left: 50%;
  pointer-events: none;
  z-index: 9998;
  font-size: 26px;
  animation: confetti-burst 1.2s cubic-bezier(0.15, 0.8, 0.3, 1) forwards;
}
@keyframes confetti-burst {
  0% { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.3) rotate(var(--rot)); opacity: 0; }
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-12px) rotate(3deg); }
}
.animate-float { animation: float 4s ease-in-out infinite; }
@keyframes pop {
  0% { transform: scale(0.9); opacity: 0; }
  70% { transform: scale(1.02); }
  100% { transform: scale(1); opacity: 1; }
}
.animate-pop { animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
.modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-content { transform: scale(0.9) translateY(30px); transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
.modal-overlay.open .modal-content { transform: scale(1) translateY(0); }
@media (max-width: 767px) {
  .modal-content.sheet { transform: translateY(100%); border-radius: 2.5rem 2.5rem 0 0; }
  .modal-overlay.open .modal-content.sheet { transform: translateY(0); }
}
.nav-item { color: #6B5B95; transition: all 0.2s; }
.nav-item.active { color: #9B5DE5; transform: translateY(-4px); }
.nav-item.active .nav-ic { transform: scale(1.15); text-shadow: 0 4px 10px rgba(155,93,229,0.3); }
.note-dot { position: absolute; bottom: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #9B5DE5; box-shadow: 0 0 0 3px #fff; }
.bento-card { border-radius: 2rem; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.bento-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(45, 31, 71, 0.1); }
.sheet-handle { width: 44px; height: 6px; border-radius: 999px; background: rgba(45, 31, 71, 0.15); margin: 0 auto 16px auto; }
.bouncy-btn { transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); }
.bouncy-btn:active { transform: scale(0.92) translateY(2px); }
.heat-0 { background: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.6); color: #2D1F47; }
.heat-1 { background: #E0B3FF; border-color: #D194FF; color: #2D1F47; }
.heat-2 { background: #C585FF; border-color: #B566FF; color: #fff; }
.heat-3 { background: #A755FF; border-color: #9B5DE5; color: #fff; }
.heat-4 { background: #8533E6; border-color: #7220CC; color: #fff; }
</style>
</head>
<body class="text-brand-ink font-body h-screen w-screen overflow-hidden flex antialiased select-none relative">

<div class="bubble-bg w-72 h-72 bg-brand-pink top-10 left-10"></div>
<div class="bubble-bg w-96 h-96 bg-brand-blue bottom-10 right-20" style="animation-delay: -3s;"></div>
<div class="bubble-bg w-80 h-80 bg-brand-yellow top-1/2 left-1/3" style="animation-delay: -6s;"></div>

<div id="setupModal" class="modal-overlay fixed inset-0 z-[100] flex items-end md:items-center justify-center bg-brand-ink/40 backdrop-blur-md px-0 md:px-4">
  <div class="modal-content sheet w-full md:w-[460px] bg-white/90 backdrop-blur-2xl p-6 md:p-8 md:rounded-4xl shadow-float safe-pb border border-white/60">
    <div class="sheet-handle md:hidden"></div>
    <div class="w-16 h-16 rounded-3xl bg-brand-purpleSoft text-brand-purple flex items-center justify-center text-3xl mb-4 animate-float"><i class="ph-fill ph-magic-wand"></i></div>
    <h2 class="font-display text-3xl font-bold mb-1 tracking-tight">Connect Quest Book ✨</h2>
    <p class="text-brand-muted text-sm mb-6 font-bold">Sync your hero journey seamlessly across devices.</p>
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-black uppercase tracking-wider text-brand-muted mb-2">Project URL</label>
        <input id="setupUrl" type="text" class="w-full bg-white/50 border border-white/80 rounded-2xl px-4 py-3.5 font-bold outline-none focus:border-brand-purple transition-all shadow-inner" placeholder="https://xxxx.supabase.co">
      </div>
      <div>
        <label class="block text-xs font-black uppercase tracking-wider text-brand-muted mb-2">Anon Key</label>
        <input id="setupKey" type="password" class="w-full bg-white/50 border border-white/80 rounded-2xl px-4 py-3.5 font-bold outline-none focus:border-brand-purple transition-all shadow-inner" placeholder="eyJh...">
      </div>
      <button onclick="handleSetupSubmit()" class="w-full bg-brand-purple text-white font-display font-bold text-xl py-4 rounded-2xl mt-2 shadow-pop hover:brightness-105 bouncy-btn flex items-center justify-center gap-2">
        <i class="ph-bold ph-rocket-launch"></i> Let's Go! 🚀
      </button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal-overlay fixed inset-0 z-[110] flex items-center justify-center bg-brand-ink/40 backdrop-blur-md px-4">
  <div class="modal-content w-full max-w-sm bg-white/95 backdrop-blur-2xl p-7 rounded-4xl shadow-float text-center border border-white">
    <div class="text-5xl mb-3">🤔</div>
    <h2 id="confirmTitle" class="font-display text-2xl font-bold mb-2"></h2>
    <p id="confirmMsg" class="text-brand-muted mb-6 text-sm font-bold"></p>
    <div class="flex gap-4">
      <button onclick="closeConfirmModal()" class="flex-1 py-3.5 rounded-2xl font-display font-bold bg-gray-200/60 hover:bg-gray-200 transition-all bouncy-btn text-brand-ink">Cancel</button>
      <button id="confirmActionBtn" class="flex-1 py-3.5 rounded-2xl font-display font-bold bg-brand-red text-white hover:brightness-110 transition-all bouncy-btn shadow-md">Confirm</button>
    </div>
  </div>
</div>

<div id="noteModal" class="modal-overlay fixed inset-0 z-[100] flex items-end md:items-center justify-center bg-brand-ink/40 backdrop-blur-md" onclick="closeModalOutside(event)">
  <div class="modal-content sheet w-full md:w-[540px] bg-white/90 backdrop-blur-2xl p-6 md:p-8 md:rounded-4xl shadow-float safe-pb max-h-[88vh] flex flex-col border border-white/60">
    <div class="sheet-handle md:hidden"></div>
    <div class="flex justify-between items-center mb-2 shrink-0">
      <h2 class="font-display text-2xl font-bold flex items-center gap-2"><i class="ph-fill ph-book-open-text text-brand-pink"></i> Quest Diary</h2>
      <button onclick="closeNoteModal()" class="w-11 h-11 rounded-full hover:bg-white/60 transition-all flex items-center justify-center shrink-0 bouncy-btn"><i class="ph-bold ph-x text-lg"></i></button>
    </div>
    <div class="flex-1 overflow-y-auto no-scrollbar pt-2">
      <p id="noteDateLabel" class="text-xs font-black uppercase tracking-wider text-brand-purple mb-2"></p>
      <textarea id="noteText" rows="4" maxlength="400" placeholder="What awesome things happened?" class="w-full bg-white/50 border border-white/80 rounded-2xl px-4 py-3 outline-none focus:border-brand-purple transition-all resize-none text-base font-bold shadow-inner"></textarea>
      <div class="flex gap-3 pt-4 pb-5">
        <button id="noteDeleteBtn" onclick="deleteNote()" class="hidden px-5 rounded-2xl bg-brand-redSoft text-brand-red hover:brightness-95 transition-all flex items-center justify-center bouncy-btn"><i class="ph-bold ph-trash text-xl"></i></button>
        <button onclick="saveNote()" class="flex-1 bg-brand-pink text-white font-display font-bold py-4 rounded-2xl shadow-md hover:brightness-105 transition-all bouncy-btn">Save Story ⭐</button>
      </div>
      <div class="border-t border-brand-muted/20 pt-4">
        <div class="text-xs font-display font-black uppercase tracking-wider text-brand-muted mb-3 flex items-center gap-1.5"><i class="ph-fill ph-clock-counter-clockwise text-brand-blue"></i> Past Stories</div>
        <div id="diaryHistoryList" class="space-y-2.5"></div>
      </div>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal-overlay fixed inset-0 z-[100] flex items-end md:items-center justify-center bg-brand-ink/40 backdrop-blur-md" onclick="closeModalOutside(event)">
  <div class="modal-content sheet w-full md:w-[480px] bg-white/90 backdrop-blur-2xl p-6 md:p-8 md:rounded-4xl shadow-float safe-pb max-h-[85vh] overflow-y-auto no-scrollbar border border-white/60">
    <div class="sheet-handle md:hidden"></div>
    <div class="flex justify-between items-center mb-6">
      <h2 class="font-display text-2xl font-bold flex items-center gap-2">⚙️ Settings</h2>
      <button onclick="closeSettingsModal()" class="w-11 h-11 rounded-full hover:bg-white/60 transition-all flex items-center justify-center bouncy-btn"><i class="ph-bold ph-x text-lg"></i></button>
    </div>
    <div class="flex items-center gap-4 p-4 rounded-3xl bg-white/60 border border-white/80 mb-6 shadow-sm">
      <div id="connDot" class="w-3 h-3 rounded-full bg-brand-green shrink-0 shadow-lg"></div>
      <div class="flex-1 min-w-0">
        <div id="connLabel" class="font-display font-bold text-base">All Synced!</div>
        <div class="text-xs text-brand-muted font-bold">Progress safely guarded in the cloud.</div>
      </div>
      <button onclick="forceSync()" class="w-12 h-12 rounded-2xl bg-brand-purpleSoft text-brand-purple flex items-center justify-center shrink-0 bouncy-btn border border-white">
        <i id="forceSyncIcon" class="ph-bold ph-arrows-clockwise text-xl"></i>
      </button>
    </div>
    <div class="text-xs font-black uppercase tracking-wider text-brand-muted px-1 mb-2">Data Management</div>
    <div class="rounded-3xl bg-white/60 border border-white/80 overflow-hidden mb-6 shadow-sm">
      <button onclick="exportData()" class="flex items-center gap-3 w-full p-4 hover:bg-white/50 transition-all font-display font-bold text-sm text-left text-brand-ink border-b border-white/40">
        <i class="ph-bold ph-download-simple text-xl text-brand-blue shrink-0"></i> <span class="flex-1">Download Backup</span>
      </button>
      <button onclick="document.getElementById('importFile').click()" class="flex items-center gap-3 w-full p-4 hover:bg-white/50 transition-all font-display font-bold text-sm text-left text-brand-ink">
        <i class="ph-bold ph-upload-simple text-xl text-brand-orange shrink-0"></i> <span class="flex-1">Restore Backup</span>
      </button>
      <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)">
    </div>
    <div class="text-xs font-black uppercase tracking-wider text-brand-muted px-1 mb-2">Danger Zone</div>
    <div class="rounded-3xl bg-white/60 border border-white/80 overflow-hidden shadow-sm">
      <button onclick="promptResetKeys()" class="flex items-center gap-3 w-full p-4 hover:bg-brand-redSoft transition-all font-display font-bold text-sm text-brand-red text-left justify-center">
        <i class="ph-bold ph-plug text-xl shrink-0"></i> <span>Disconnect Account</span>
      </button>
    </div>
  </div>
</div>

<div id="habitModal" class="modal-overlay fixed inset-0 z-[100] flex items-end md:items-center justify-center bg-brand-ink/40 backdrop-blur-md" onclick="closeModalOutside(event)">
  <div class="modal-content sheet w-full md:w-[560px] bg-white/95 backdrop-blur-2xl p-6 md:p-8 md:rounded-4xl shadow-float safe-pb max-h-[90vh] overflow-y-auto no-scrollbar border border-white/60">
    <div class="sheet-handle md:hidden"></div>
    <div class="flex justify-between items-center mb-6">
      <h2 id="modalTitle" class="font-display text-3xl font-bold tracking-tight text-brand-purple">Create Quest</h2>
      <button onclick="closeModal()" class="w-11 h-11 rounded-full hover:bg-white/60 transition-all flex items-center justify-center bouncy-btn"><i class="ph-bold ph-x text-xl"></i></button>
    </div>
    <div class="space-y-6">
      <div>
        <label class="block text-xs font-black uppercase tracking-wider text-brand-muted mb-2">Quest Name</label>
        <input id="hName" type="text" class="w-full bg-white/50 border border-white/80 rounded-2xl px-4 py-4 font-bold text-lg outline-none focus:border-brand-purple transition-all shadow-inner" placeholder="e.g., Read 10 pages 📚" maxlength="40">
      </div>
      <div>
        <label class="block text-xs font-black uppercase tracking-wider text-brand-muted mb-2">Icon</label>
        <div id="emojiRow" class="flex flex-wrap gap-2.5 bg-white/50 p-3 rounded-2xl border border-white/80"></div>
      </div>
      <div>
        <label class="block text-xs font-black uppercase tracking-wider text-brand-muted mb-2">Aura Color</label>
        <div id="colorRow" class="flex gap-3 overflow-x-auto no-scrollbar py-1"></div>
      </div>
      <div>
        <label class="block text-xs font-black uppercase tracking-wider text-brand-muted mb-2">Quest Type</label>
        <div class="relative">
          <select id="hType" onchange="onTypeChange()" class="w-full bg-white/50 border border-white/80 rounded-2xl px-4 py-3.5 font-bold outline-none appearance-none focus:border-brand-purple transition-all cursor-pointer shadow-inner">
            <option value="daily">Daily</option>
            <option value="multi">Multiple Times Daily</option>
            <option value="weekly">Specific Days/Week</option>
            <option value="break">Break a Habit (Shield)</option>
          </select>
          <i class="ph-bold ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-brand-muted"></i>
        </div>
      </div>
      <div id="typeExtra"></div>
      <div>
        <label class="block text-xs font-black uppercase tracking-wider text-brand-muted mb-2">Mastery Goal (Days/Reps)</label>
        <input id="hGoal" type="number" class="w-full bg-white/50 border border-white/80 rounded-2xl px-4 py-3.5 font-bold outline-none focus:border-brand-purple transition-all shadow-inner" min="1" max="365" value="60">
      </div>
      <div class="p-4 rounded-3xl bg-white/60 border border-white/80 shadow-sm">
        <div class="flex items-center justify-between mb-1">
          <label class="text-base font-display font-bold flex items-center gap-2"><i class="ph-fill ph-bell text-brand-orange"></i> Reminder</label>
          <button id="reminderToggle" onclick="toggleReminder()" class="w-14 h-8 rounded-full bg-gray-300 relative transition-all shrink-0">
            <span id="reminderKnob" class="absolute top-1 left-1 w-6 h-6 rounded-full bg-white shadow-md transition-transform"></span>
          </button>
        </div>
        <p class="text-xs text-brand-muted font-bold mb-3">Daily nudge if not completed.</p>
        <input id="reminderTime" type="time" value="09:00" class="w-full bg-white/50 border border-white/80 rounded-xl px-4 py-3 font-bold outline-none focus:border-brand-purple transition-all">
      </div>
      <div class="flex gap-4 pt-2">
        <button id="deleteBtn" onclick="promptDeleteHabit()" class="hidden px-5 rounded-2xl bg-brand-redSoft text-brand-red hover:brightness-95 transition-all flex items-center justify-center bouncy-btn"><i class="ph-bold ph-trash text-xl"></i></button>
        <button onclick="saveHabit()" class="flex-1 bg-brand-purple text-white font-display font-bold text-xl py-4 rounded-2xl shadow-md hover:brightness-105 transition-all bouncy-btn">
          Save Quest
        </button>
      </div>
    </div>
  </div>
</div>

<aside class="hidden md:flex glass-panel flex-col w-64 h-full shrink-0 z-40 relative safe-pt safe-pb shadow-lg">
  <div class="p-6 flex items-center gap-3 border-b border-white/30">
    <div class="w-10 h-10 rounded-xl bg-brand-purple text-white flex items-center justify-center text-xl shadow-md">
      <i class="ph-fill ph-compass-tool"></i>
    </div>
    <span class="font-display font-bold text-2xl tracking-tight bg-gradient-to-r from-brand-purple to-brand-pink bg-clip-text text-transparent">Trailmark</span>
  </div>
  
  <div class="flex-1 overflow-y-auto no-scrollbar py-4 px-3 space-y-1">
    <div class="text-xs font-black uppercase tracking-wider text-brand-muted px-3 mb-2 mt-2">Views</div>
    <button onclick="setView('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-3 py-3 rounded-2xl text-brand-ink hover:bg-white/50 font-bold transition-all bouncy-btn desktop-nav">
      <i class="ph-fill ph-squares-four text-xl"></i> Dashboard
    </button>
    <button onclick="setView('global_calendar')" id="nav-calendar" class="w-full flex items-center gap-3 px-3 py-3 rounded-2xl text-brand-ink hover:bg-white/50 font-bold transition-all bouncy-btn desktop-nav">
      <i class="ph-fill ph-calendar-blank text-xl"></i> Calendar
    </button>
    <button onclick="setView('shop')" id="nav-shop" class="w-full flex items-center gap-3 px-3 py-3 rounded-2xl text-brand-ink hover:bg-white/50 font-bold transition-all bouncy-btn desktop-nav">
      <i class="ph-fill ph-storefront text-xl"></i> Shop
    </button>

    <div class="text-xs font-black uppercase tracking-wider text-brand-muted px-3 mb-2 mt-6 flex items-center justify-between">
      <span>Your Quests</span>
      <button onclick="openAddModal()" class="text-brand-purple hover:scale-110 transition-transform"><i class="ph-bold ph-plus text-lg"></i></button>
    </div>
    <div id="sidebarHabitList" class="space-y-1"></div>
  </div>

  <div class="p-4 border-t border-white/30">
    <button onclick="openSettingsModal()" class="w-full flex items-center gap-3 px-3 py-3 rounded-2xl text-brand-muted hover:text-brand-ink hover:bg-white/50 font-bold transition-all bouncy-btn">
      <i class="ph-fill ph-gear-six text-xl"></i> Settings
    </button>
  </div>
</aside>

<main class="flex-1 flex flex-col h-full w-full overflow-hidden relative">
  <header class="md:hidden glass-card shrink-0 w-full z-40 safe-pt px-4 py-3 flex items-center justify-between border-b border-white/50">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-brand-purple text-white flex items-center justify-center shadow-md">
        <i class="ph-fill ph-compass-tool text-sm"></i>
      </div>
      <span class="font-display font-bold text-lg tracking-tight text-brand-ink">Trailmark</span>
    </div>
    <div class="flex items-center gap-3">
      <div class="bg-white/80 px-3 py-1.5 rounded-full border border-white/80 flex items-center gap-1.5 shadow-sm text-sm font-bold">
        <span>💰</span> <span class="coinBadgeValue">0</span>
      </div>
      <button onclick="openSettingsModal()" class="w-9 h-9 bg-white/60 rounded-xl flex items-center justify-center text-brand-ink bouncy-btn shadow-sm border border-white">
        <i class="ph-bold ph-gear-six"></i>
      </button>
    </div>
  </header>

  <div id="content" class="flex-1 overflow-y-auto no-scrollbar relative scroll-smooth content-safe-pb md:safe-pb md:p-8 p-4"></div>

  <nav class="md:hidden fixed bottom-4 left-4 right-4 glass-card rounded-3xl shadow-float z-50 flex justify-around items-center py-2 px-2 border border-white safe-pb-nav">
    <button onclick="setView('dashboard')" id="mob-nav-dashboard" class="nav-item flex flex-col items-center p-2 w-16 gap-1 bouncy-btn mobile-nav">
      <i class="ph-fill ph-squares-four nav-ic text-2xl transition-transform"></i><span class="text-[10px] font-display font-bold">Home</span>
    </button>
    <button onclick="setView('global_calendar')" id="mob-nav-calendar" class="nav-item flex flex-col items-center p-2 w-16 gap-1 bouncy-btn mobile-nav">
      <i class="ph-fill ph-calendar-blank nav-ic text-2xl transition-transform"></i><span class="text-[10px] font-display font-bold">Calendar</span>
    </button>
    <button onclick="openAddModal()" class="flex items-center justify-center -translate-y-5 w-14 h-14 bg-brand-pink text-white rounded-full shadow-lg active:scale-95 transition-all shrink-0 border-[3px] border-white bouncy-btn">
      <i class="ph-bold ph-plus text-2xl"></i>
    </button>
    <button onclick="setView('shop')" id="mob-nav-shop" class="nav-item flex flex-col items-center p-2 w-16 gap-1 bouncy-btn mobile-nav">
      <i class="ph-fill ph-storefront nav-ic text-2xl transition-transform"></i><span class="text-[10px] font-display font-bold">Shop</span>
    </button>
    <button onclick="setView('stats')" id="mob-nav-stats" class="nav-item flex flex-col items-center p-2 w-16 gap-1 bouncy-btn mobile-nav">
      <i class="ph-fill ph-chart-line-up nav-ic text-2xl transition-transform"></i><span class="text-[10px] font-display font-bold">Stats</span>
    </button>
  </nav>
</main>

<div id="toast" class="fixed bottom-28 md:bottom-10 left-1/2 -translate-x-1/2 bg-brand-ink/95 backdrop-blur-md text-white px-6 py-3.5 rounded-full font-display font-bold text-sm shadow-float flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none z-[200] translate-y-4 max-w-[90vw] border border-white/20 whitespace-nowrap">
  <i class="ph-fill ph-sparkle text-lg text-brand-yellow animate-bounce"></i> <span id="toastMsg" class="truncate"></span>
</div>

<script>
const COLORS = ['#FF4D6D', '#FF8A5B', '#FEE440', '#00F5D4', '#00BBF9', '#9B5DE5', '#F15BB5', '#6D28D9', '#33D2FF', '#F97316'];
const EMOJIS = ['🚀', '🎯', '💪', '🧠', '💧', '🥗', '🏃', '🧘', '📚', '🎨', '🎵', '⭐', '💰', '😴', '🐱', '☕', '🌱', '🏔️', '🏆', '🔥'];
const DOW_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

let _supabase = null;
let habits = [];
let activeId = null;
let currentView = 'dashboard';
let editingId = null;
let selectedEmoji = EMOJIS[0];
let selectedColor = COLORS[0];
let reminderEnabled = false;
let calMonth = new Date();
let notesEditingDate = null;
let syncState = 'idle';
let dirtyIds = new Set();
let dirtyDeletes = [];

function loadProfile() {
  try {
    const saved = JSON.parse(localStorage.getItem('heroProfile') || 'null');
    if (saved && typeof saved.xp === 'number') return saved;
  } catch (e) {}
  return { xp: 0, coins: 0, initialized: false };
}
let profile = loadProfile();
if (typeof profile.coins !== 'number') profile.coins = 0;

function saveProfile() {
  try { localStorage.setItem('heroProfile', JSON.stringify(profile)); } catch (e) {}
}

function addXp(amount) {
  profile.xp = Math.max(0, (profile.xp || 0) + amount);
  saveProfile();
  updateCoinBadge();
}

function addCoins(amount) {
  profile.coins = Math.max(0, (profile.coins || 0) + amount);
  saveProfile();
  updateCoinBadge();
}

const SHOP_ITEMS = [
  { id: 'shield_1', emoji: '🛡️', name: 'Magic Shield', desc: '+1 Shield to active quest.', cost: 40, effect: 'shield', amount: 1 },
  { id: 'shield_3', emoji: '🛡️✨', name: 'Shield Pack', desc: '+3 Shields to active quest.', cost: 100, effect: 'shield', amount: 3 },
  { id: 'freeze_streak', emoji: '❄️', name: 'Streak Freeze', desc: 'Instantly mark today safe.', cost: 60, effect: 'freeze', amount: 1 }
];

function buyShopItem(itemId) {
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if (!item) return;
  const h = activeId && activeId !== 'dashboard' && activeId !== 'global_calendar' && activeId !== 'shop' && activeId !== 'stats' ? getHabit(activeId) : habits[0];
  if (!h) { showToast('Add a quest first! 🗺️'); return; }
  if ((profile.coins || 0) < item.cost) { showToast('Not enough coins! 💰'); return; }
  
  addCoins(-item.cost);
  if (item.effect === 'shield') {
    h.shieldBank = (h.shieldBank || 0) + item.amount;
    showToast(`+${item.amount} Shield for ${h.name} 🛡️`);
  } else if (item.effect === 'freeze') {
    const todayStr = getTodayStr();
    if (!h.log) h.log = {};
    if (!h.log[todayStr]) {
      h.log[todayStr] = 'shield';
      showToast(`${h.name} frozen today ❄️`);
    } else {
      showToast('Today already logged! ❄️');
      addCoins(item.cost);
      return;
    }
  }
  syncHabitToCloud(h);
  renderContent();
}

function getLevelInfo() {
  const xp = profile.xp || 0;
  const perLevel = 50;
  const level = Math.floor(xp / perLevel) + 1;
  const xpIntoLevel = xp % perLevel;
  const pct = Math.round((xpIntoLevel / perLevel) * 100);
  return { level, xp, xpIntoLevel, xpForNext: perLevel, pct };
}

function ensureProfileInitialized() {
  if (profile.initialized) return;
  let totalCompletions = 0;
  habits.forEach(h => {
    if (h.type === 'break') return;
    totalCompletions += Object.keys(h.log || {}).filter(k => typeof h.log[k] === 'number' ? h.log[k] > 0 : h.log[k] === true).length;
  });
  profile.xp = Math.max(profile.xp || 0, totalCompletions * 10);
  profile.coins = Math.max(profile.coins || 0, totalCompletions * 2);
  profile.initialized = true;
  saveProfile();
}

function updateCoinBadge() {
  document.querySelectorAll('.coinBadgeValue').forEach(b => { b.textContent = profile.coins || 0; });
}

const haptic = (p) => { if (navigator.vibrate) navigator.vibrate(p); };

function generateHabitId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'h_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}

function checkSetup() {
  const sbUrl = localStorage.getItem('SB_URL');
  const sbKey = localStorage.getItem('SB_KEY');
  if (!sbUrl || !sbKey) { document.getElementById('setupModal').classList.add('open'); return; }
  initSupabase(sbUrl, sbKey);
}

function handleSetupSubmit() {
  const url = document.getElementById('setupUrl').value.trim();
  const key = document.getElementById('setupKey').value.trim();
  if (url && key) {
    localStorage.setItem('SB_URL', url);
    localStorage.setItem('SB_KEY', key);
    document.getElementById('setupModal').classList.remove('open');
    initSupabase(url, key);
  } else { showToast('Fill in both fields! 🌟'); }
}

function initSupabase(url, key) {
  _supabase = supabase.createClient(url, key);
  loadDataFromCloud();
}

async function loadDataFromCloud() {
  setSyncStatus('syncing');
  const { data, error } = await _supabase.from('habits').select('*').order('createdAt', { ascending: true });
  if (error) {
    setSyncStatus('error');
    document.getElementById('content').innerHTML = `<div class="p-10 font-bold text-brand-muted text-center">Sync Error. Check your internet or keys.</div>`;
    return;
  }
  habits = data || [];
  habits.forEach(h => { h.shieldBank = h.freezeBank !== undefined ? h.freezeBank : 2; });
  dirtyIds.clear(); dirtyDeletes = [];
  ensureProfileInitialized(); runDailyCheckIn(); updateCoinBadge(); renderAll(); setSyncStatus('synced');
}

function formatDateLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getTodayStr() { return formatDateLocal(new Date()); }

function runDailyCheckIn() {
  const todayStr = getTodayStr();
  const lastCheckIn = localStorage.getItem('lastCheckInDate');
  if (lastCheckIn === todayStr) return;
  localStorage.setItem('lastCheckInDate', todayStr);
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const yStr = formatDateLocal(yesterday);
  const twoDaysAgo = new Date(); twoDaysAgo.setDate(twoDaysAgo.getDate() - 2);
  const twoStr = formatDateLocal(twoDaysAgo);
  let shieldsUsed = 0;
  habits.forEach(h => {
    if (h.type === 'break') return;
    if (!h.log) h.log = {};
    if (!h.log[yStr] && h.log[twoStr] && (h.shieldBank || 0) > 0) {
      h.log[yStr] = 'shield'; h.shieldBank -= 1; shieldsUsed++; syncHabitToCloud(h);
    }
  });
  if (shieldsUsed > 0) showToast('Shield Saved Your Streak! 🛡️');
}

function setSyncStatus(state) {
  syncState = state;
  const dot = document.getElementById('connDot'); const label = document.getElementById('connLabel');
  const icon = document.getElementById('forceSyncIcon');
  if (!dot) return;
  let color = '#00F5D4', text = 'All Saved!';
  if (state === 'syncing') { color = '#FEE440'; text = 'Syncing...'; }
  else if (state === 'error') { color = '#FF4D6D'; text = 'Sync error'; }
  else if (!navigator.onLine) { color = '#FF4D6D'; text = 'Offline Mode'; }
  dot.style.background = color; label.textContent = text;
  icon.classList.toggle('animate-spin-slow', state === 'syncing');
}

async function syncHabitToCloud(habit) {
  setSyncStatus('syncing');
  if (!_supabase) return;
  try {
    const dbHabit = {
      id: habit.id, name: habit.name, emoji: habit.emoji, color: habit.color, type: habit.type, goal: parseInt(habit.goal) || 60,
      reminder: habit.reminder, dailyTarget: habit.dailyTarget !== undefined ? parseInt(habit.dailyTarget) : null,
      weeklyGoal: habit.weeklyGoal !== undefined ? parseInt(habit.weeklyGoal) : null, log: habit.log || {}, notes: habit.notes || {},
      freezeBank: habit.shieldBank !== undefined ? habit.shieldBank : 2, createdAt: habit.createdAt
    };
    const { data, error } = await _supabase.from('habits').upsert(dbHabit).select();
    if (error) { dirtyIds.add(habit.id); setSyncStatus('error'); }
    else {
      dirtyIds.delete(habit.id);
      if (data && data.length > 0 && habit.id !== data[0].id) {
        if (activeId === habit.id) activeId = data[0].id;
        habit.id = data[0].id;
      }
      setSyncStatus('synced');
    }
  } catch (e) { dirtyIds.add(habit.id); setSyncStatus('error'); }
}

async function deleteHabitFromCloud(id) {
  setSyncStatus('syncing');
  if (!_supabase) return;
  try {
    const { error } = await _supabase.from('habits').delete().eq('id', id);
    if (error) { dirtyDeletes.push(id); setSyncStatus('error'); } else { setSyncStatus('synced'); }
  } catch (e) { dirtyDeletes.push(id); setSyncStatus('error'); }
}

function forceSync() {
  if (!navigator.onLine || !_supabase) return;
  habits.forEach(h => syncHabitToCloud(h));
  dirtyDeletes.forEach(id => deleteHabitFromCloud(id));
}

function createParticles(e) {
  const container = document.body;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX || rect.left + rect.width/2;
  const y = e.clientY || rect.top + rect.height/2;
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');
    p.style.backgroundColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    p.style.width = p.style.height = `${Math.floor(Math.random() * 8) + 6}px`;
    p.style.left = `${x}px`; p.style.top = `${y}px`;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 80 + 30;
    p.style.setProperty('--tx', `${Math.cos(angle) * speed}px`);
    p.style.setProperty('--ty', `${Math.sin(angle) * speed}px`);
    container.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function triggerConfetti() {
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('div');
    c.classList.add('confetti');
    c.innerText = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    const angle = Math.random() * Math.PI * 2;
    const distance = Math.random() * 200 + 80;
    c.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
    c.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
    c.style.setProperty('--rot', `${Math.random() * 360}deg`);
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1200);
  }
}

function getHabit(id) { return habits.find(x => x.id === id); }

function setView(view, hId = null) {
  currentView = view;
  if (hId) activeId = hId;
  haptic(10);
  
  document.querySelectorAll('.desktop-nav').forEach(el => {
    el.classList.toggle('bg-white/70', el.id === `nav-${view}`);
    el.classList.toggle('text-brand-purple', el.id === `nav-${view}`);
  });
  
  document.querySelectorAll('.mobile-nav').forEach(el => {
    el.classList.toggle('active', el.id === `mob-nav-${view}`);
  });

  renderSidebarList();
  renderContent();
}

function renderSidebarList() {
  const container = document.getElementById('sidebarHabitList');
  if (!container) return;
  if (habits.length === 0) {
    container.innerHTML = `<div class="px-3 py-2 text-xs text-brand-muted font-bold">No quests yet.</div>`;
    return;
  }
  container.innerHTML = habits.map(h => {
    const active = currentView === 'habit_detail' && activeId === h.id;
    return `
      <div onclick="setView('habit_detail', '${h.id}')" class="flex items-center gap-3 px-3 py-2.5 rounded-2xl cursor-pointer transition-all bouncy-btn ${active ? 'bg-white/80 shadow-sm border border-white text-brand-purple' : 'hover:bg-white/50 text-brand-ink'}">
        <span class="text-xl">${h.emoji}</span>
        <span class="font-bold text-sm truncate flex-1">${h.name}</span>
      </div>
    `;
  }).join('');
}

function renderAll() {
  renderSidebarList();
  renderContent();
}

function renderContent() {
  const content = document.getElementById('content');
  if (!content) return;
  if (habits.length === 0 && currentView !== 'shop' && currentView !== 'stats') {
    content.innerHTML = `
      <div class="flex flex-col items-center justify-center h-full text-center p-6 animate-pop">
        <div class="text-7xl mb-4 animate-float">🗺️</div>
        <h3 class="font-display text-3xl font-bold mb-2">Map is Empty</h3>
        <p class="text-brand-muted font-bold max-w-sm mb-6">Create your first quest and earn xp!</p>
        <button onclick="openAddModal()" class="px-6 py-4 bg-brand-purple text-white font-display font-bold rounded-2xl shadow-md bouncy-btn flex items-center gap-2 text-lg">
          <i class="ph-bold ph-plus-circle"></i> Summon Quest
        </button>
      </div>
    `;
    return;
  }
  
  if (currentView === 'dashboard') renderDashboard(content);
  else if (currentView === 'global_calendar') renderGlobalCalendar(content);
  else if (currentView === 'shop') renderShopView(content);
  else if (currentView === 'stats') renderGlobalStats(content);
  else if (currentView === 'habit_detail') renderHabitDetail(content);
}

function renderDashboard(content) {
  const todayStr = getTodayStr();
  let doneCount = 0;
  let activeCount = 0;

  const cardsHtml = habits.map(h => {
    if (h.type !== 'break') activeCount++;
    const logVal = h.log && h.log[todayStr];
    let isDone = false;
    let actionBlock = '';
    
    if (h.type === 'multi') {
      const current = typeof logVal === 'number' ? logVal : 0;
      const target = h.dailyTarget || 3;
      if (current >= target) { isDone = true; doneCount++; }
      actionBlock = `
        <div class="flex items-center gap-3 bg-white/50 rounded-xl px-2 py-1 border border-white">
          <button onclick="adjustMultiReps('${h.id}', -1, event)" class="w-8 h-8 flex items-center justify-center font-bold text-brand-ink bouncy-btn rounded-lg hover:bg-white/50">-</button>
          <span class="font-display font-bold text-lg min-w-[2ch] text-center">${current}</span>
          <button onclick="adjustMultiReps('${h.id}', 1, event)" class="w-8 h-8 flex items-center justify-center font-bold text-white bg-brand-purple rounded-lg bouncy-btn shadow-sm">+</button>
        </div>
      `;
    } else if (h.type === 'break') {
      isDone = logVal === true;
      actionBlock = `
        <button onclick="toggleSingleHabit('${h.id}', event)" class="w-12 h-12 rounded-xl border-2 flex items-center justify-center text-xl transition-all bouncy-btn ${isDone ? 'bg-brand-red border-brand-red text-white' : 'bg-brand-green/20 border-brand-green text-brand-green hover:bg-brand-green/30'}">
          ${isDone ? '💥' : '🛡️'}
        </button>
      `;
    } else {
      isDone = !!logVal;
      if (isDone) doneCount++;
      actionBlock = `
        <button onclick="toggleSingleHabit('${h.id}', event)" class="w-12 h-12 rounded-xl border-2 flex items-center justify-center text-xl transition-all bouncy-btn ${isDone ? 'bg-brand-green border-brand-green text-white shadow-inner' : 'bg-white/80 border-brand-purple hover:bg-white shadow-sm'}">
          ${isDone ? '✅' : h.emoji}
        </button>
      `;
    }

    const stats = getHabitStats(h);
    
    return `
      <div class="bento-card glass-card p-4 md:p-5 flex items-center gap-4 animate-pop border border-white/80 cursor-pointer" onclick="if(event.target.tagName !== 'BUTTON') setView('habit_detail', '${h.id}')">
        <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl shrink-0" style="background-color: ${h.color}30">
          ${h.emoji}
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="font-display font-bold text-lg truncate text-brand-ink">${h.name}</h4>
          <div class="text-xs font-bold text-brand-muted flex items-center gap-2">
            <span class="uppercase tracking-wider font-black text-[10px]">${h.type}</span>
            <span>•</span>
            <span>${stats.isBreakType ? '🛡️' : '🔥'} ${stats.streak}</span>
          </div>
        </div>
        <div class="shrink-0" onclick="event.stopPropagation()">
          ${actionBlock}
        </div>
      </div>
    `;
  }).join('');

  const pct = activeCount > 0 ? Math.round((doneCount / activeCount) * 100) : 0;
  const d = new Date();
  const dateStr = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  content.innerHTML = `
    <div class="max-w-4xl mx-auto w-full">
      <div class="flex flex-col md:flex-row gap-6 mb-8 animate-pop">
        <div class="flex-1">
          <h2 class="font-display text-3xl md:text-4xl font-bold text-brand-ink mb-1">Welcome back!</h2>
          <p class="text-brand-muted font-bold text-sm md:text-base">${dateStr}</p>
        </div>
        <div class="bento-card glass-card p-5 flex items-center gap-5 border border-white min-w-[240px]">
          <div class="relative w-16 h-16 flex items-center justify-center shrink-0">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
              <path class="text-white/50" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path class="text-brand-purple transition-all duration-1000" stroke-dasharray="${pct}, 100" stroke-width="4" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>
            <span class="absolute font-display font-bold text-sm">${pct}%</span>
          </div>
          <div>
            <div class="font-display font-bold text-lg leading-tight">Daily Quests</div>
            <div class="text-sm font-bold text-brand-muted">${doneCount} of ${activeCount} done</div>
          </div>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        ${cardsHtml}
      </div>
    </div>
  `;
}

function renderGlobalCalendar(content) {
  const currentMonthIdx = calMonth.getMonth();
  const currentYear = calMonth.getFullYear();
  const firstDay = new Date(currentYear, currentMonthIdx, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonthIdx + 1, 0).getDate();
  const todayStr = getTodayStr();

  let gridHtml = '';
  for (let i = 0; i < firstDay; i++) { gridHtml += `<div></div>`; }

  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${currentYear}-${String(currentMonthIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    let compCount = 0;
    let activeCount = 0;
    
    habits.forEach(h => {
      if (h.type === 'break') return;
      activeCount++;
      const val = h.log ? h.log[dStr] : null;
      if (val === 'shield' || val === true || (typeof val === 'number' && val > 0)) compCount++;
    });

    let intensity = 0;
    if (activeCount > 0 && compCount > 0) {
      const ratio = compCount / activeCount;
      if (ratio > 0.75) intensity = 4;

function calculateStreak(h) {
  if (!h.log) return 0;
  let streak = 0;
  let checkDate = new Date();
  while (true) {
    const dStr = formatDateLocal(checkDate);
    if (h.log[dStr]) streak++;
    else {
      if (streak === 0) {
        checkDate.setDate(checkDate.getDate() - 1);
        const prevStr = formatDateLocal(checkDate);
        if (h.log[prevStr]) { streak++; checkDate.setDate(checkDate.getDate() - 1); continue; }
      }
      break;
    }
    checkDate.setDate(checkDate.getDate() - 1);
  }
  return streak;
}

function calculateBreakStreak(h) {
  if (!h.log) h.log = {};
  const start = h.createdAt ? new Date(h.createdAt) : new Date(); start.setHours(0,0,0,0);
  let checkDate = new Date(); checkDate.setHours(0,0,0,0);
  let streak = 0;
  while (checkDate >= start) {
    if (h.log[formatDateLocal(checkDate)]) break;
    streak++; checkDate.setDate(checkDate.getDate() - 1);
  }
  return streak;
}

function getHabitStats(h) {
  if (h.type === 'break') {
    const streak = calculateBreakStreak(h);
    const brokenDays = Object.keys(h.log || {}).filter(k => h.log[k] === true).length;
    const start = h.createdAt ? new Date(h.createdAt) : new Date(); start.setHours(0,0,0,0);
    const totalDays = Math.max(1, Math.floor((new Date().setHours(0,0,0,0) - start) / 86400000) + 1);
    return { streak, totalWins: Math.max(0, totalDays - brokenDays), brokenDays, isBreakType: true };
  }
  const streak = calculateStreak(h);
  const totalWins = Object.keys(h.log || {}).filter(k => typeof h.log[k] === 'number' ? h.log[k] > 0 : h.log[k] === true).length;
  return { streak, totalWins, brokenDays: 0, isBreakType: false };
}

function adjustCalMonth(dir) {
  calMonth.setMonth(calMonth.getMonth() + dir);
  renderContent();
}

function toggleSingleHabit(id, e) {
  e.stopPropagation();
  createParticles(e);
  haptic(15);
  const h = getHabit(id);
  if (!h) return;
  const todayStr = getTodayStr();
  if (!h.log) h.log = {};
  if (h.type === 'break') {
    if (h.log[todayStr]) { delete h.log[todayStr]; showToast('Marked as resisted again! 🛡️'); }
    else { h.log[todayStr] = true; showToast('Shield Broken! 💥'); }
  } else {
    if (h.log[todayStr]) { delete h.log[todayStr]; addXp(-10); addCoins(-2); }
    else { h.log[todayStr] = true; triggerConfetti(); addXp(10); addCoins(2); showToast('+10 XP ⭐ +2 Coins 💰'); }
  }
  syncHabitToCloud(h);
  renderContent();
}

function adjustMultiReps(id, dir, e) {
  e.stopPropagation();
  createParticles(e);
  haptic(12);
  const h = getHabit(id);
  if (!h) return;
  const todayStr = getTodayStr();
  if (!h.log) h.log = {};
  let current = typeof h.log[todayStr] === 'number' ? h.log[todayStr] : 0;
  const wasPos = current > 0;
  current = Math.max(0, current + dir);
  if (current === 0) delete h.log[todayStr];
  else h.log[todayStr] = current;
  if (dir > 0) { triggerConfetti(); addXp(10); addCoins(2); showToast('+10 XP ⭐ +2 Coins 💰'); }
  else if (dir < 0 && wasPos) { addXp(-10); addCoins(-2); }
  syncHabitToCloud(h);
  renderContent();
}

  if (editingId) {

    if (activeId === editingId) setView('dashboard');
    renderAll(); closeModal(); showToast('Quest removed.');
  });
}

function openNoteModal(dateStr) {
  notesEditingDate = dateStr;
  const h = getHabit(activeId);
  if (!h) return;
  document.getElementById('noteDateLabel').textContent = `Story for ${dateStr}`;
  const cNote = h.notes && h.notes[dateStr] ? h.notes[dateStr] : '';
  document.getElementById('noteText').value = cNote;
  document.getElementById('noteDeleteBtn').classList.toggle('hidden', !cNote);
  
  const historyList = document.getElementById('diaryHistoryList');
  let historyHtml = '';
  if (h.notes) {
    Object.keys(h.notes).sort((a,b) => b.localeCompare(a)).forEach(d => {
      if (h.notes[d]) historyHtml += `<div class="p-3 bg-white/50 border border-white rounded-xl text-xs font-bold text-brand-ink"><div class="text-brand-purple mb-1 font-display">${d}</div><div>${h.notes[d]}</div></div>`;
    });
  }
  historyList.innerHTML = historyHtml || `<div class="text-xs text-brand-muted font-bold text-center py-2">No entries yet.</div>`;
  document.getElementById('noteModal').classList.add('open');
}

function closeNoteModal() { document.getElementById('noteModal').classList.remove('open'); }

function saveNote() {
  const text = document.getElementById('noteText').value.trim();
  const h = getHabit(activeId);
  if (!h) return;
  if (!h.notes) h.notes = {};
  if (text) { h.notes[notesEditingDate] = text; showToast('Story recorded! 📝'); }
  else delete h.notes[notesEditingDate];
  syncHabitToCloud(h); renderContent(); closeNoteModal();
}

function deleteNote() {
  const h = getHabit(activeId);
  if (!h || !h.notes) return;
  delete h.notes[notesEditingDate];
  syncHabitToCloud(h); renderContent(); closeNoteModal(); showToast('Story deleted.');
}

function showConfirmModal(title, msg, callback) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  const btn = document.getElementById('confirmActionBtn');
  btn.onclick = () => { callback(); closeConfirmModal(); };
  document.getElementById('confirmModal').classList.add('open');
}
function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('open'); }

function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  toast.style.opacity = '1'; toast.style.pointerEvents = 'all'; toast.style.transform = 'translate(-50%, 0)';
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => { toast.style.opacity = '0'; toast.style.pointerEvents = 'none'; toast.style.transform = 'translate(-50%, 16px)'; }, 3000);
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(habits, null, 2));
  const a = document.createElement('a'); a.href = dataStr; a.download = `trailmark_backup_${Date.now()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imp = JSON.parse(e.target.result);
      if (Array.isArray(imp)) {
        habits = imp;
        habits.forEach(h => syncHabitToCloud(h));
        setView('dashboard'); showToast('Backup imported! 🎒');
      } else showToast('Invalid file format.');
    } catch (err) { showToast('Parse error.'); }
  };
  reader.readAsText(file);
}

function promptResetKeys() {
  showConfirmModal('Disconnect', 'Are you sure you want to disconnect? Local data stays safe.', () => {
    localStorage.removeItem('SB_URL'); localStorage.removeItem('SB_KEY'); location.reload();
  });
}

window.addEventListener('online', () => setSyncStatus('synced'));
window.addEventListener('offline', () => setSyncStatus('offline'));

window.onload = () => {
  checkSetup();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  updateCoinBadge();
};
</script>
</body>
</html>
