<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Trailmark — Quest Habit Tracker</title>
<meta name="description" content="Turn habits into quests, protect streaks with Magic Shields, and celebrate every milestone.">
<meta name="theme-color" content="#8B5CF6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trailmark">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { display: ['Fredoka','sans-serif'], body: ['Nunito','sans-serif'], mono: ['JetBrains Mono','monospace'] },
      colors: {
        brand: {
          bg:'#FFF6E9', panel:'#FFFFFF', sunken:'#FFF0DA', ink:'#392C55', muted:'#8D84A8', line:'#F1E3C8',
          purple:'#8B5CF6', purpleDeep:'#6D28D9', purpleSoft:'#F1EBFF',
          pink:'#FF6FA0', pinkSoft:'#FFE9F1',
          blue:'#33C2F2', blueSoft:'#E4F7FF',
          green:'#33D69A', greenSoft:'#E4FBF1',
          yellow:'#FFC94A', yellowSoft:'#FFF6DE',
          orange:'#FF8B5E', orangeSoft:'#FFEDE3',
          red:'#FF5C6C', redSoft:'#FFE7E9',
          shield:'#33D2FF', shieldSoft:'#E1F8FF'
        }
      },
      borderRadius: { '3xl':'1.75rem', '4xl':'2.25rem', '5xl':'2.75rem' },
      boxShadow: {
        bento:'0 10px 0 0 rgba(57,44,85,0.08), 0 18px 34px -14px rgba(57,44,85,0.18)',
        pop:'0 8px 0 0 rgba(57,44,85,0.14)',
        float:'0 22px 50px -14px rgba(57,44,85,0.3)'
      }
    }
  }
}
</script>
<style>
*{-webkit-tap-highlight-color:transparent;}
html,body{background:#FFF6E9;}
body{font-family:'Nunito',sans-serif; overscroll-behavior-y:none; color:#392C55;}
.font-display{font-family:'Fredoka',sans-serif;}
.font-num{font-family:'Fredoka',sans-serif; font-variant-numeric:tabular-nums;}
.no-scrollbar::-webkit-scrollbar{display:none;}
.no-scrollbar{-ms-overflow-style:none; scrollbar-width:none;}
.safe-pb{padding-bottom:env(safe-area-inset-bottom,14px);}
.safe-pt{padding-top:env(safe-area-inset-top,0px);}
button,a,[role="button"]{touch-action:manipulation;}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:3px solid #8B5CF6; outline-offset:2px; border-radius:16px;
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}}

.particle{position:absolute; border-radius:50%; pointer-events:none; z-index:9999; animation:shoot .7s cubic-bezier(.1,.8,.3,1) forwards;}
@keyframes shoot{0%{transform:translate(0,0) scale(1) rotate(0deg); opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(0) rotate(180deg); opacity:0;}}
.confetti{position:fixed; top:50%; left:50%; pointer-events:none; z-index:[9998]; font-size:22px; animation:confetti-burst 1.1s cubic-bezier(.15,.8,.3,1) forwards;}
@keyframes confetti-burst{0%{transform:translate(-50%,-50%) scale(0.4) rotate(0deg); opacity:1;}100%{transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(var(--rot)); opacity:0;}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
.animate-float{animation:float 3.6s ease-in-out infinite;}
@keyframes wiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-6deg);}75%{transform:rotate(6deg);}}
.animate-wiggle{animation:wiggle .5s ease-in-out;}
@keyframes pop{0%{transform:scale(.8); opacity:0;}60%{transform:scale(1.06);}100%{transform:scale(1); opacity:1;}}
.animate-pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes bounceIn{0%{transform:scale(.7) translateY(30px); opacity:0;}60%{transform:scale(1.03) translateY(-4px); opacity:1;}100%{transform:scale(1) translateY(0);}}
@keyframes spin-slow{to{transform:rotate(360deg);}}
.animate-spin-slow{animation:spin-slow 1s linear infinite;}

.modal-overlay{opacity:0; pointer-events:none; transition:opacity .25s ease;}
.modal-overlay.open{opacity:1; pointer-events:all;}
.modal-content{transform:scale(.92) translateY(24px); transition:all .35s cubic-bezier(.34,1.56,.64,1);}
.modal-overlay.open .modal-content{transform:scale(1) translateY(0);}
@media (max-width:767px){
  .modal-content.sheet{transform:translateY(100%); border-radius:32px 32px 0 0;}
  .modal-overlay.open .modal-content.sheet{transform:translateY(0);}
}
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
.check-ring{transition:stroke-dashoffset .9s cubic-bezier(.34,1.56,.64,1);}
.tab-pill{color:#8D84A8;}
.tab-pill.active{background:#8B5CF6; color:#fff; box-shadow:0 6px 0 0 #6D28D9;}
.nav-item{color:#8D84A8;}
.nav-item.active{color:#8B5CF6;}
.nav-item.active .nav-ic{transform:translateY(-3px) scale(1.15);}
.rail-item.active{background:#FFF0DA;}
.shield-cell{background-image:repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(51,210,255,0.22) 3px, rgba(51,210,255,0.22) 6px);}
.skip-cell{background-image:repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(255,201,74,0.28) 3px, rgba(255,201,74,0.28) 6px);}
.note-dot{position:absolute; bottom:4px; right:4px; width:6px; height:6px; border-radius:50%; background:#8B5CF6; box-shadow:0 0 0 2px #fff;}
.day-cell{-webkit-user-select:none; user-select:none;}
.bento-card{border-radius:2rem; box-shadow:0 10px 0 0 rgba(57,44,85,0.07), 0 18px 34px -14px rgba(57,44,85,0.16);}
.sync-dot{transition:background .3s ease;}
.diary-clamp{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
</style>
</head>
<body class="bg-brand-bg text-brand-ink font-body h-screen w-screen overflow-hidden flex flex-col md:flex-row antialiased selection:bg-brand-purpleSoft">

<div id="setupModal" class="modal-overlay fixed inset-0 z-50 flex items-end md:items-center justify-center bg-brand-ink/50 backdrop-blur-sm px-0 md:px-4">
  <div class="modal-content sheet w-full md:w-[440px] bg-brand-panel p-7 md:p-8 md:rounded-4xl shadow-float safe-pb">
    <div class="w-14 h-14 rounded-3xl bg-brand-purpleSoft text-brand-purple flex items-center justify-center text-2xl mb-4 animate-float"><i class="ph-fill ph-magic-wand"></i></div>
    <h2 class="font-display text-2xl font-bold mb-1">Connect your quest book</h2>
    <p class="text-brand-muted text-sm mb-6 font-semibold">Pop in your Supabase keys so your quests sync everywhere, instantly.</p>
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-extrabold uppercase tracking-wide text-brand-muted mb-2">Project URL</label>
        <input id="setupUrl" type="text" class="w-full bg-brand-bg border-2 border-brand-line rounded-2xl px-4 py-3.5 font-bold outline-none focus:border-brand-purple transition-colors" placeholder="https://xxxx.supabase.co">
      </div>
      <div>
        <label class="block text-xs font-extrabold uppercase tracking-wide text-brand-muted mb-2">Anon Key</label>
        <input id="setupKey" type="password" class="w-full bg-brand-bg border-2 border-brand-line rounded-2xl px-4 py-3.5 font-bold outline-none focus:border-brand-purple transition-colors" placeholder="eyJh...">
      </div>
      <button onclick="handleSetupSubmit()" class="w-full bg-brand-purple text-white font-display font-bold text-lg py-4 rounded-2xl mt-2 shadow-pop hover:brightness-105 active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2">
        <i class="ph-bold ph-rocket-launch"></i> Let's go!
      </button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal-overlay fixed inset-0 z-[60] flex items-center justify-center bg-brand-ink/50 backdrop-blur-sm px-4">
  <div class="modal-content w-full max-w-sm bg-brand-panel p-7 rounded-4xl shadow-float text-center">
    <div class="text-4xl mb-3">🤔</div>
    <h2 id="confirmTitle" class="font-display text-xl font-bold mb-2"></h2>
    <p id="confirmMsg" class="text-brand-muted mb-6 text-sm font-semibold"></p>
    <div class="flex gap-3">
      <button onclick="closeConfirmModal()" class="flex-1 py-3.5 rounded-2xl font-display font-bold bg-brand-bg hover:bg-brand-sunken transition-colors">Never mind</button>
      <button id="confirmActionBtn" class="flex-1 py-3.5 rounded-2xl font-display font-bold bg-brand-redSoft text-brand-red hover:brightness-95 transition-colors">Yes, do it</button>
    </div>
  </div>
</div>

<div id="noteModal" class="modal-overlay fixed inset-0 z-[60] flex items-end md:items-center justify-center bg-brand-ink/50 backdrop-blur-sm" onclick="closeModalOutside(event)">
  <div class="modal-content sheet w-full md:w-[520px] bg-brand-panel p-6 md:p-7 md:rounded-4xl shadow-float safe-pb max-h-[88vh] flex flex-col">
    <div class="flex justify-between items-center mb-1 shrink-0">
      <h2 class="font-display text-xl font-bold flex items-center gap-2"><i class="ph-fill ph-book-open-text text-brand-purple"></i> Quest Diary</h2>
      <button onclick="closeNoteModal()" class="w-9 h-9 rounded-full hover:bg-brand-bg transition-colors flex items-center justify-center shrink-0"><i class="ph-bold ph-x text-lg"></i></button>
    </div>
    <div class="flex-1 overflow-y-auto no-scrollbar pt-3">
      <p id="noteDateLabel" class="text-xs font-extrabold uppercase tracking-wide text-brand-purple mb-2"></p>
      <textarea id="noteText" rows="4" maxlength="400" placeholder="What happened today? Write a little diary note..." class="w-full bg-brand-bg border-2 border-brand-line rounded-2xl px-4 py-3 outline-none focus:border-brand-purple transition-colors resize-none text-sm font-semibold"></textarea>
      <div class="flex gap-3 pt-4 pb-5">
        <button id="noteDeleteBtn" onclick="deleteNote()" class="hidden px-4 rounded-2xl bg-brand-redSoft text-brand-red hover:brightness-95 transition-colors flex items-center justify-center"><i class="ph-bold ph-trash text-lg"></i></button>
        <button onclick="saveNote()" class="flex-1 bg-brand-purple text-white font-display font-bold py-3.5 rounded-2xl shadow-pop active:translate-y-1 active:shadow-none transition-all">Save diary entry</button>
      </div>
      <div class="border-t-2 border-brand-line pt-4">
        <div class="text-xs font-display font-extrabold uppercase tracking-wide text-brand-muted mb-2.5 flex items-center gap-1.5"><i class="ph-fill ph-clock-counter-clockwise"></i> Past entries</div>
        <div id="diaryHistoryList" class="space-y-2"></div>
      </div>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal-overlay fixed inset-0 z-[60] flex items-end md:items-center justify-center bg-brand-ink/50 backdrop-blur-sm" onclick="closeModalOutside(event)">
  <div class="modal-content sheet w-full md:w-[460px] bg-brand-panel p-7 md:rounded-4xl shadow-float safe-pb max-h-[85vh] overflow-y-auto no-scrollbar">
    <div class="flex justify-between items-center mb-6">
      <h2 class="font-display text-xl font-bold">Settings</h2>
      <button onclick="closeSettingsModal()" class="w-9 h-9 rounded-full hover:bg-brand-bg transition-colors flex items-center justify-center"><i class="ph-bold ph-x text-lg"></i></button>
    </div>
    <div class="flex items-center gap-3 p-4 rounded-3xl bg-brand-bg mb-4 border-2 border-brand-line">
      <div id="connDot" class="sync-dot w-3 h-3 rounded-full bg-brand-green shrink-0"></div>
      <div class="flex-1 min-w-0">
        <div id="connLabel" class="font-display font-bold text-sm">Synced</div>
        <div class="text-xs text-brand-muted font-bold">Every tap saves to the cloud right away.</div>
      </div>
      <button id="forceSyncBtn" onclick="forceSync()" class="w-11 h-11 rounded-2xl bg-brand-purpleSoft text-brand-purple flex items-center justify-center shrink-0 hover:brightness-95 active:scale-90 transition-all" title="Force sync">
        <i id="forceSyncIcon" class="ph-bold ph-arrows-clockwise text-lg"></i>
      </button>
    </div>
    <div class="space-y-2 mb-6">
      <div class="text-xs font-extrabold uppercase tracking-wide text-brand-muted px-1 mb-2">Your quest data</div>
      <button onclick="exportData()" class="w-full flex items-center gap-3 p-4 rounded-2xl bg-brand-bg hover:bg-brand-sunken transition-colors font-display font-bold text-sm">
        <i class="ph-bold ph-download-simple text-lg text-brand-purple"></i> Export data (.json)
      </button>
      <button onclick="document.getElementById('importFile').click()" class="w-full flex items-center gap-3 p-4 rounded-2xl bg-brand-bg hover:bg-brand-sunken transition-colors font-display font-bold text-sm">
        <i class="ph-bold ph-upload-simple text-lg text-brand-purple"></i> Import data (.json)
      </button>
      <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)">
    </div>
    <div class="space-y-2">
      <div class="text-xs font-extrabold uppercase tracking-wide text-brand-muted px-1 mb-2">Connection</div>
      <button onclick="promptResetKeys()" class="w-full flex items-center gap-3 p-4 rounded-2xl bg-brand-redSoft text-brand-red hover:brightness-95 transition-colors font-display font-bold text-sm">
        <i class="ph-bold ph-plug text-lg"></i> Disconnect database
      </button>
    </div>
  </div>
</div>

<div id="habitModal" class="modal-overlay fixed inset-0 z-50 flex items-end md:items-center justify-center bg-brand-ink/50 backdrop-blur-sm" onclick="closeModalOutside(event)">
  <div class="modal-content sheet w-full md:w-[540px] bg-brand-panel p-7 md:p-8 md:rounded-4xl shadow-float safe-pb max-h-[90vh] overflow-y-auto no-scrollbar">
    <div class="flex justify-between items-center mb-6">
      <h2 id="modalTitle" class="font-display text-2xl font-bold">New Quest</h2>
      <button onclick="closeModal()" class="w-9 h-9 rounded-full hover:bg-brand-bg transition-colors flex items-center justify-center"><i class="ph-bold ph-x text-xl"></i></button>
    </div>
    <div class="space-y-6">
      <div>
        <label class="block text-xs font-extrabold uppercase tracking-wide text-brand-muted mb-2">Quest name</label>
        <input id="hName" type="text" class="w-full bg-brand-bg border-2 border-brand-line rounded-2xl px-4 py-3.5 font-bold outline-none focus:border-brand-purple transition-colors" placeholder="e.g., Read 10 pages" maxlength="40">
      </div>
      <div>
        <label class="block text-xs font-extrabold uppercase tracking-wide text-brand-muted mb-2">Quest icon</label>
        <div id="emojiRow" class="flex flex-wrap gap-2"></div>
      </div>
      <div>
        <label class="block text-xs font-extrabold uppercase tracking-wide text-brand-muted mb-2">Quest color</label>
        <div id="colorRow" class="flex gap-3 overflow-x-auto no-scrollbar py-1"></div>
      </div>
      <div>
        <label class="block text-xs font-extrabold uppercase tracking-wide text-brand-muted mb-2">Quest type</label>
        <div class="relative">
          <select id="hType" onchange="onTypeChange()" class="w-full bg-brand-bg border-2 border-brand-line rounded-2xl px-4 py-3.5 font-bold outline-none appearance-none focus:border-brand-purple transition-colors cursor-pointer">
            <option value="daily">Daily (once a day)</option>
            <option value="multi">Multi-Daily (a few times)</option>
            <option value="weekly">Weekly (certain days)</option>
            <option value="break">Break (avoid a habit)</option>
          </select>
          <i class="ph-bold ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-brand-muted"></i>
        </div>
      </div>
      <div id="typeExtra"></div>
      <div>
        <label class="block text-xs font-extrabold uppercase tracking-wide text-brand-muted mb-2">Goal (reps to master)</label>
        <input id="hGoal" type="number" class="w-full bg-brand-bg border-2 border-brand-line rounded-2xl px-4 py-3.5 font-bold outline-none focus:border-brand-purple transition-colors" min="1" max="365" value="60">
      </div>
      <div class="p-4 rounded-3xl bg-brand-bg border-2 border-brand-line">
        <div class="flex items-center justify-between mb-1">
          <label class="text-sm font-display font-bold flex items-center gap-2"><i class="ph-fill ph-bell text-brand-purple"></i> Daily reminder</label>
          <button id="reminderToggle" onclick="toggleReminder()" class="w-12 h-7 rounded-full bg-brand-line relative transition-colors shrink-0" aria-label="Toggle reminder">
            <span id="reminderKnob" class="absolute top-0.5 left-0.5 w-6 h-6 rounded-full bg-white shadow-sm transition-transform"></span>
          </button>
        </div>
        <p class="text-xs text-brand-muted font-bold mb-3">Nudges you with a notification if not done by this time.</p>
        <input id="reminderTime" type="time" value="09:00" class="w-full bg-brand-panel border-2 border-brand-line rounded-2xl px-4 py-2.5 font-bold outline-none focus:border-brand-purple transition-colors">
      </div>
      <div class="flex gap-3 pt-2">
        <button id="deleteBtn" onclick="promptDeleteHabit()" class="hidden px-4 rounded-2xl bg-brand-redSoft text-brand-red hover:brightness-95 transition-colors flex items-center justify-center"><i class="ph-bold ph-trash text-xl"></i></button>
        <button onclick="saveHabit()" class="flex-1 bg-brand-purple text-white font-display font-bold text-lg py-4 rounded-2xl shadow-pop active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2">
          <i class="ph-bold ph-check-circle"></i> Save quest
        </button>
      </div>
    </div>
  </div>
</div>

<aside class="hidden md:flex flex-col md:w-[68px] lg:w-60 bg-brand-panel border-r-2 border-brand-line h-full z-20 shrink-0 transition-all">
  <div class="p-3 lg:p-4 flex items-center gap-2.5 justify-center lg:justify-start">
    <div class="w-9 h-9 rounded-xl bg-brand-purple flex items-center justify-center text-white text-lg shrink-0 shadow-pop">
      <i class="ph-fill ph-compass-tool"></i>
    </div>
    <span class="hidden lg:inline font-display font-bold text-lg tracking-tight">Trailmark</span>
  </div>
  <div class="px-2.5 lg:px-3 pb-3">
    <button onclick="openAddModal()" class="w-full py-2.5 border-[3px] border-dashed border-brand-line rounded-2xl text-brand-muted font-display font-bold text-sm hover:border-brand-purple hover:text-brand-purple transition-all flex items-center justify-center gap-1.5">
      <i class="ph-bold ph-plus"></i> <span class="hidden lg:inline">New quest</span>
    </button>
  </div>
  <div id="habitListDesktop" class="flex-1 overflow-y-auto no-scrollbar px-2.5 lg:px-3 space-y-1 pb-4">
    <div class="animate-pulse space-y-2.5">
      <div class="h-12 bg-brand-bg rounded-2xl"></div>
      <div class="h-12 bg-brand-bg rounded-2xl"></div>
      <div class="h-12 bg-brand-bg rounded-2xl"></div>
    </div>
  </div>
  <div id="sidebarSync" class="mx-2.5 lg:mx-3 mb-2.5 p-2.5 rounded-2xl bg-brand-bg border-2 border-brand-line flex items-center gap-2 cursor-pointer hover:bg-brand-sunken transition-colors" onclick="forceSync()">
    <div id="connDot2" class="sync-dot w-2 h-2 rounded-full bg-brand-green shrink-0"></div>
    <div id="connLabel2" class="text-[11px] font-display font-bold flex-1 min-w-0 truncate hidden lg:block">Synced</div>
    <i id="forceSyncIcon2" class="ph-bold ph-arrows-clockwise text-brand-muted shrink-0 text-sm"></i>
  </div>
  <div class="p-2.5 lg:p-3 border-t-2 border-brand-line">
    <button onclick="openSettingsModal()" class="w-full py-2.5 flex items-center justify-center lg:justify-start gap-2.5 text-brand-muted hover:text-brand-ink transition-colors font-display font-bold text-sm rounded-2xl hover:bg-brand-bg px-2 lg:px-3">
      <i class="ph-fill ph-gear-six"></i> <span class="hidden lg:inline">Settings</span>
    </button>
  </div>
</aside>

<main class="flex-1 flex flex-col h-full relative z-10 w-full overflow-hidden">
  <header class="bg-brand-panel/90 backdrop-blur-xl border-b-2 border-brand-line safe-pt sticky top-0 z-30">
    <div id="mobileStrip" class="md:hidden flex overflow-x-auto no-scrollbar px-3 py-2 gap-2.5 snap-x border-b-2 border-brand-line"></div>
    <div class="px-3 md:px-4 lg:px-5 py-2 flex items-center justify-between gap-2 md:gap-3">
      <div id="datePill" class="font-display font-bold text-[11px] md:text-xs bg-brand-bg px-2.5 md:px-3 py-1.5 rounded-full flex items-center gap-1.5 shrink-0 border-2 border-brand-line">
        <i class="ph-fill ph-sun text-brand-yellow"></i> <span></span>
      </div>
      <div id="tabBar" class="hidden md:flex bg-brand-bg p-1 rounded-full border-2 border-brand-line overflow-x-auto no-scrollbar">
        <button onclick="setView('today', this)" data-view="today" class="tab-pill active px-3.5 py-1.5 rounded-full text-xs md:text-[13px] font-display font-bold transition-all whitespace-nowrap">Today</button>
        <button onclick="setView('calendar', this)" data-view="calendar" class="tab-pill px-3.5 py-1.5 rounded-full text-xs md:text-[13px] font-display font-bold transition-all whitespace-nowrap">Calendar</button>
        <button onclick="setView('stats', this)" data-view="stats" class="tab-pill px-3.5 py-1.5 rounded-full text-xs md:text-[13px] font-display font-bold transition-all whitespace-nowrap">Stats</button>
        <button onclick="setView('insights', this)" data-view="insights" class="tab-pill px-3.5 py-1.5 rounded-full text-xs md:text-[13px] font-display font-bold transition-all whitespace-nowrap">Insights</button>
      </div>
      <button class="md:hidden w-9 h-9 rounded-full flex items-center justify-center bg-brand-bg text-brand-muted shrink-0 border-2 border-brand-line" onclick="openSettingsModal()"><i class="ph-bold ph-gear-six"></i></button>
    </div>
  </header>

  <div id="content" class="flex-1 overflow-y-auto no-scrollbar p-3.5 sm:p-5 md:p-6 lg:p-8 pb-28 md:pb-8 relative scroll-smooth">
    <div class="flex flex-col items-center justify-center h-full gap-8 animate-pulse">
      <div class="w-56 h-56 md:w-64 md:h-64 rounded-[3rem] bg-brand-sunken"></div>

<div id="toast" class="fixed bottom-24 md:bottom-10 left-1/2 -translate-x-1/2 bg-brand-ink text-white px-5 py-3 rounded-full font-display font-bold text-sm shadow-float flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none z-[70] translate-y-4 max-w-[92vw]">

<script>
const COLORS = ['#FF5C6C','#FF8B5E','#FFC94A','#33D69A','#33C2F2','#8B5CF6','#FF6FA0','#6D28D9','#33D2FF','#F97316'];
const EMOJIS = ['🚀','🎯','💪','🧠','💧','🥗','🏃','🧘','📚','🎨','🎵','🚭','💰','😴','🐶','☕','🌱','🏔️','🏆','🔥'];
const JOURNEY = [
  "Every quest begins with a single brave step!",
  "First week done! Your quest power is growing.",
  "Momentum unlocked! Keep the magic going.",
  "A whole month! This is starting to feel easy.",
  "Halfway to hero status. Amazing work!",
  "Home stretch! You're basically unstoppable now.",
  "So close! One last push to legendary.",
  "Quest mastered! This habit is part of you now."
];
const DOW_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let _supabase = null;
let habits = [];
let activeId = null;
let currentView = 'today';
let editingId = null;
let selectedEmoji = EMOJIS[0];
let selectedColor = COLORS[0];
let reminderEnabled = false;
let calMonth = new Date();
let prevRepsState = {};
let pendingDelete = null;
let deleteTimeout = null;
let notesEditingDate = null;
let longPressTimer = null;
let longPressFired = false;
let swRegistration = null;
let syncState = 'idle';
let dirtyIds = new Set();
let dirtyDeletes = [];

const haptic = (p) => { if (navigator.vibrate) navigator.vibrate(p); };

function checkSetup() {
  const sbUrl = localStorage.getItem('SB_URL');
  const sbKey = localStorage.getItem('SB_KEY');
  if (!sbUrl || !sbKey) {
    document.getElementById('setupModal').classList.add('open');
    return;
  }
  initSupabase(sbUrl, sbKey);
}

function handleSetupSubmit() {
  const url = document.getElementById('setupUrl').value.trim();
  const key = document.getElementById('setupKey').value.trim();
  if (url && key) {
    localStorage.setItem('SB_URL', url);
    localStorage.setItem('SB_KEY', key);
    document.getElementById('setupModal').classList.remove('open');
    initSupabase(url, key);
  } else {
    showToast('Please fill in both fields');
  }
}

function initSupabase(url, key) {
  _supabase = supabase.createClient(url, key);
  setDatePill();
  loadDataFromCloud();
}

async function loadDataFromCloud() {
  setSyncStatus('syncing');
  const { data, error } = await _supabase.from('habits').select('*').order('createdAt', { ascending: true });
  if (error) {
    setSyncStatus('error');
    document.getElementById('content').innerHTML = `<div class="text-center p-10 font-display font-bold text-brand-muted">Hmm, couldn't reach the quest book. Check your keys and reload.</div>`;
    return;
  }
  habits = data || [];
  if (habits.length > 0 && !activeId) activeId = habits[0].id;
  dirtyIds.clear();
  dirtyDeletes = [];
  renderAll();
  setSyncStatus('synced');
}

function setSyncStatus(state) {
  syncState = state;
  const dot = document.getElementById('connDot');
  const dot2 = document.getElementById('connDot2');
  const label = document.getElementById('connLabel');
  const label2 = document.getElementById('connLabel2');
  const icon = document.getElementById('forceSyncIcon');
  const icon2 = document.getElementById('forceSyncIcon2');
  if (!dot) return;
  const dirtyCount = dirtyIds.size + dirtyDeletes.length;
  let color = '#33D69A', text = 'Synced';
  if (state === 'syncing') { color = '#FFC94A'; text = 'Syncing...'; }
  else if (state === 'error') { color = '#FF5C6C'; text = dirtyCount ? `${dirtyCount} not synced` : 'Sync error'; }
  else if (!navigator.onLine) { color = '#FF5C6C'; text = 'No connection'; }
  [dot, dot2].forEach(d => d && (d.style.background = color));
  [label, label2].forEach(l => l && (l.textContent = text));
  [icon, icon2].forEach(i => i && i.classList.toggle('animate-spin-slow', state === 'syncing'));
}

async function syncHabitToCloud(habit) {
  setSyncStatus('syncing');
  if (!_supabase) return;
  try {
    const { error } = await _supabase.from('habits').upsert(habit);
    if (error) { dirtyIds.add(habit.id); setSyncStatus('error'); showToast('Could not save — tap Force Sync'); }
    else { dirtyIds.delete(habit.id); setSyncStatus('synced'); }
  } catch (e) { dirtyIds.add(habit.id); setSyncStatus('error'); showToast('Could not save — tap Force Sync'); }
}

async function deleteHabitFromCloud(id) {
  setSyncStatus('syncing');
  if (!_supabase) return;
  try {
    const { error } = await _supabase.from('habits').delete().eq('id', id);
    if (error) { dirtyDeletes.push(id); setSyncStatus('error'); }
    else setSyncStatus('synced');
  } catch (e) { dirtyDeletes.push(id); setSyncStatus('error'); }
}

async function forceSync() {
  const icon = document.getElementById('forceSyncIcon');
  const icon2 = document.getElementById('forceSyncIcon2');
  [icon, icon2].forEach(i => i && i.classList.add('animate-spin-slow'));
  haptic(15);
  setSyncStatus('syncing');
  if (dirtyIds.size || dirtyDeletes.length) {
    for (const id of Array.from(dirtyIds)) { const h = getHabit(id); if (h) await syncHabitToCloud(h); }
    for (const id of dirtyDeletes.slice()) { await deleteHabitFromCloud(id); dirtyDeletes = dirtyDeletes.filter(x => x !== id); }
  }
  await loadDataFromCloud();
  showToast('All synced up!');
}

window.addEventListener('online', () => { showToast('Back online!'); forceSync(); });
window.addEventListener('offline', () => { setSyncStatus('error'); showToast('No connection — quests will retry syncing'); });

function showConfirmModal(title, msg, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  const btn = document.getElementById('confirmActionBtn');
  btn.onclick = () => { onConfirm(); closeConfirmModal(); };
  document.getElementById('confirmModal').classList.add('open');
  haptic(10);
}
function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('open'); }

function openSettingsModal() { setSyncStatus(syncState); document.getElementById('settingsModal').classList.add('open'); haptic(10); }
function closeSettingsModal() { document.getElementById('settingsModal').classList.remove('open'); }

function promptResetKeys() {
  showConfirmModal("Disconnect", "Remove your database keys from this device?", () => {
    localStorage.removeItem('SB_URL');
    localStorage.removeItem('SB_KEY');
    window.location.reload();
  });
}

function exportData() {
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), habits }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `trailmark-quests-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Quests exported!');
  closeSettingsModal();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const incoming = Array.isArray(parsed) ? parsed : parsed.habits;
      if (!Array.isArray(incoming)) throw new Error('bad format');
      showConfirmModal('Import quests', `Merge ${incoming.length} quest${incoming.length===1?'':'s'} into your list?`, async () => {
        const existingIds = new Set(habits.map(h => h.id));
        for (const h of incoming) {
          if (!h.id) h.id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
          if (existingIds.has(h.id)) { const idx = habits.findIndex(x => x.id === h.id); habits[idx] = h; }
          else { habits.push(h); existingIds.add(h.id); }
          await syncHabitToCloud(h);
        }
        activeId = habits[0]?.id || null;
        renderAll();
        showToast('Quests imported!');
      });
    } catch (e) { showToast('That file looks invalid'); }
    event.target.value = '';
  };
  reader.readAsText(file);
  closeSettingsModal();
}

function getHabit(id) { return habits.find(h => h.id === id); }
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isNeutral(val) { return val === 'skip' || val === 'shield'; }

function getTotalReps(h) {
  if (!h.log) return 0;
  if (h.type === 'daily' || h.type === 'break') return Object.values(h.log).filter(v => v === true || typeof v === 'number').length;
  if (h.type === 'multi') return Object.values(h.log).reduce((s, v) => s + (typeof v === 'number' ? v : 0), 0);
  if (h.type === 'weekly') {
    let reps = 0;
    const weeks = groupByWeek(h.log);
    for (const [, days] of Object.entries(weeks)) if (days >= (h.weeklyGoal || 3)) reps++;
    return reps;
  }
  return 0;
}

function groupByWeek(log) {
  const weeks = {};
  for (const [date, val] of Object.entries(log)) {
    if (isNeutral(val) || !val) continue;
    const d = new Date(date + 'T00:00:00');
    const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7));
    const wk = mon.toISOString().slice(0,10);
    weeks[wk] = (weeks[wk] || 0) + 1;
  }
  return weeks;
}

function getProgress(h) { return Math.min(getTotalReps(h) / (h.goal || 60), 1); }

function isCheckedToday(h) {
  const today = todayKey();
  if (isNeutral(h.log?.[today])) return h.log[today];
  if (h.type === 'multi') return (h.log?.[today] || 0) >= (h.dailyTarget || 1);
  return !!h.log?.[today];
}

function getLevel(h) {
  const reps = getTotalReps(h);
  return Math.min(7, Math.floor(reps / (h.goal || 60) * 8));
}

function calcStreak(h) {
  const log = h.log || {};
  let streak = 0;
  const d = new Date();
  while (true) {
    const k = d.toISOString().slice(0,10);
    const val = log[k];
    if (isNeutral(val)) { d.setDate(d.getDate()-1); continue; }
    if (h.type === 'multi') {
      if (typeof val === 'number' && val >= (h.dailyTarget||1)) { streak++; d.setDate(d.getDate()-1); } else break;
    } else {
      if (val === true) { streak++; d.setDate(d.getDate()-1); } else break;
    }
  }
  return streak;
}

function calcBestStreak(h) {
  const log = h.log || {};
  const dates = Object.keys(log).sort();
  if (!dates.length) return 0;
  let best = 0, cur = 0;
  for (let i=0; i<dates.length; i++) {
    const val = log[dates[i]];
    if (isNeutral(val)) continue;
    let success = false;
    if (h.type === 'multi') success = typeof val === 'number' && val >= (h.dailyTarget||1);
    else success = val === true;
    if (success) { cur++; best = Math.max(best, cur); } else cur = 0;
  }
  return best;
}

function isSuccess(h, val) {
  if (h.type === 'multi') return typeof val === 'number' && val >= (h.dailyTarget||1);
  return val === true;
}

function getDowStats(h) {
  const log = h.log || {};
  const totals = Array.from({length:7}, () => ({ success:0, tracked:0 }));
  const created = h.createdAt ? new Date(h.createdAt) : null;
  const start = created || new Date(Date.now() - 1000*60*60*24*365);
  const end = new Date();
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
    const k = d.toISOString().slice(0,10);
    const val = log[k];
    if (isNeutral(val)) continue;
    const dow = d.getDay();
    totals[dow].tracked++;
    if (isSuccess(h, val)) totals[dow].success++;
  }
  return totals.map((t,i) => ({ dow:i, label:DOW_LABELS[i], rate: t.tracked ? t.success/t.tracked : 0, tracked:t.tracked }));
}

function getWeeklyMatrix(h, weeks) {
  const log = h.log || {};
  const out = [];
  const today = new Date();
  const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay()+6)%7));
  for (let w = weeks-1; w >= 0; w--) {
    const wkStart = new Date(monday); wkStart.setDate(monday.getDate() - w*7);
    let success = 0, tracked = 0;
    for (let i=0; i<7; i++) {
      const d = new Date(wkStart); d.setDate(wkStart.getDate()+i);
      if (d > today) continue;
      const k = d.toISOString().slice(0,10);
      const val = log[k];
      if (isNeutral(val)) continue;
      tracked++;
      if (isSuccess(h, val)) success++;
    }
    out.push({ label: wkStart.toLocaleDateString('en-US',{month:'short',day:'numeric'}), rate: tracked ? success/tracked : 0, tracked });
  }
  return out;
}

function dailySuccessSeries(h, days) {
  const log = h.log || {};
  const out = {};
  const today = new Date();
  for (let i=days-1; i>=0; i--) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const k = d.toISOString().slice(0,10);
    const val = log[k];
    if (isNeutral(val)) continue;
    out[k] = isSuccess(h, val) ? 1 : 0;
  }
  return out;
}

function pearson(xs, ys) {
  const n = xs.length;
  if (n < 8) return null;
  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, dx=0, dy=0;
  for (let i=0;i<n;i++){ const a=xs[i]-mx, b=ys[i]-my; num+=a*b; dx+=a*a; dy+=b*b; }
  if (dx===0 || dy===0) return null;
  return num/Math.sqrt(dx*dy);
}

function computeCorrelations() {
  const series = habits.map(h => dailySuccessSeries(h, 90));
  const pairs = [];
  for (let i=0;i<habits.length;i++){
    for (let j=i+1;j<habits.length;j++){
      const a = series[i], b = series[j];
      const shared = Object.keys(a).filter(k => k in b);
      if (shared.length < 10) continue;
      const xs = shared.map(k=>a[k]), ys = shared.map(k=>b[k]);
      const r = pearson(xs, ys);
      if (r === null) continue;
      pairs.push({ a: habits[i], b: habits[j], r, n: shared.length });
    }
  }
  return pairs.sort((p,q) => Math.abs(q.r) - Math.abs(p.r));
}

function checkShieldEarn(h) {
  const streak = calcStreak(h);
  if (streak > 0 && streak % 7 === 0) {
    const key = `shield_awarded_${h.id}_${streak}`;
    if (!localStorage.getItem(key)) {
      localStorage.setItem(key, '1');
      h.shieldBank = Math.min(5, (h.shieldBank || 0) + 1);
      showToast('7-day streak! +1 Magic Shield earned 🛡️');
    }
  }
}

function renderSidebar() {
  const list = document.getElementById('habitListDesktop');
  if (!habits.length) {
    list.innerHTML = `<div class="p-6 text-center text-brand-muted font-display font-bold text-sm hidden lg:block">Create a quest to begin!</div>`;
    return;
  }
  const renderItem = (h) => {
    const pct = getProgress(h) * 100;
    const isActive = h.id === activeId;
    const status = isCheckedToday(h);
    const opacity = status === true ? 'opacity-50' : 'opacity-100';
    const activeClass = isActive ? 'bg-brand-bg border-brand-line shadow-pop scale-[1.02]' : 'border-transparent hover:bg-brand-bg/60';
    const isDirty = dirtyIds.has(h.id);
    return `<div class="group flex items-center gap-2.5 p-2 rounded-2xl cursor-pointer border-2 transition-all justify-center lg:justify-start ${activeClass} ${opacity}" onclick="selectHabit('${h.id}')" title="${h.name.replace(/"/g,'')}">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg bg-brand-panel shadow-pop shrink-0 transition-transform group-hover:scale-110 group-hover:rotate-6 relative border-2 border-brand-line">${h.emoji}
        ${status==='skip'||status==='shield'?`<span class="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full ${status==='shield'?'bg-brand-shield':'bg-brand-orange'} text-white text-[9px] flex items-center justify-center border-2 border-brand-panel"><i class="ph-bold ${status==='shield'?'ph-shield-check':'ph-fast-forward'}"></i></span>`:''}
        ${isDirty?`<span class="absolute -bottom-1 -left-1 w-3 h-3 rounded-full bg-brand-red border-2 border-brand-panel"></span>`:''}
      </div>
      <div class="flex-1 min-w-0 hidden lg:block">
        <div class="font-display font-bold text-[13px] truncate mb-1">${h.name}</div>
        <div class="h-1.5 w-full bg-brand-line rounded-full overflow-hidden">
          <div class="h-full rounded-full transition-all duration-700 ease-out" style="width:${pct}%;background:${h.color}"></div>
        </div>
      </div>
    </div>`;
  };
  let html = '';
  if (habits.length >= 8) {
    const pending = habits.filter(h => !isCheckedToday(h));
    const done = habits.filter(h => isCheckedToday(h));
    if (pending.length) html += `<div class="text-[10px] font-display font-bold text-brand-muted tracking-wider uppercase mt-4 mb-2 px-2 hidden lg:block">To do</div>` + pending.map(renderItem).join('');
    if (done.length) html += `<div class="text-[10px] font-display font-bold text-brand-muted tracking-wider uppercase mt-4 mb-2 px-2 hidden lg:block">Done</div>` + done.map(renderItem).join('');
  } else {
    html = habits.map(renderItem).join('');
  }
  list.innerHTML = html;
}

function renderMobileStrip() {
  const strip = document.getElementById('mobileStrip');
  if (!habits.length) { strip.style.display = 'none'; return; }
  strip.style.display = 'flex';
  strip.innerHTML = habits.map(h => {
    const isActive = h.id === activeId;
    const status = isCheckedToday(h);
    const op = status === true ? 'opacity-50' : 'opacity-100';
    const activeCls = isActive ? 'scale-110' : 'scale-95 opacity-70';
    return `<div class="flex flex-col items-center gap-1 snap-start transition-all cursor-pointer ${activeCls} ${op}" onclick="selectHabit('${h.id}')">
      <div class="w-11 h-11 rounded-full flex items-center justify-center text-lg bg-brand-panel shadow-pop border-2 relative ${isActive ? 'border-brand-purple' : 'border-brand-line'}">${h.emoji}${status==='shield'?`<span class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-brand-shield text-white text-[8px] flex items-center justify-center border-2 border-brand-panel"><i class="ph-bold ph-shield-check"></i></span>`:''}</div>
      <div class="w-1 h-1 rounded-full" style="background:${isActive ? h.color : 'transparent'}"></div>
    </div>`;
  }).join('');
  const activeEl = strip.querySelector('.scale-110');
  if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function renderTabBar() {
  document.querySelectorAll('#tabBar .tab-pill').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
}

function renderContent() {
  const el = document.getElementById('content');
  renderTabBar();
  if (currentView === 'insights') { renderInsights(el); return; }
  const h = getHabit(activeId);
  if (!habits.length || !h) {
    el.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center animate-pop max-w-md mx-auto">
      <div class="text-7xl mb-6 drop-shadow-xl animate-float">🌟</div>
      <h2 class="font-display text-3xl font-bold mb-3 tracking-tight">Start your quest log!</h2>
      <p class="text-brand-muted font-bold mb-8">Turn your habits into fun quests and watch your streaks grow.</p>
      <button class="bg-brand-purple text-white font-display font-bold text-lg px-8 py-4 rounded-full shadow-pop hover:brightness-105 active:translate-y-1 active:shadow-none transition-all flex items-center gap-2" onclick="openAddModal()"><i class="ph-bold ph-plus"></i> Add first quest</button>
    </div>`;
    return;
  }
  if (currentView === 'today') renderToday(el, h);
  else if (currentView === 'calendar') renderCalendar(el, h);
  else renderStats(el, h);
}

function animateValue(obj, start, end, duration) {
  let startTimestamp = null;
  const step = (timestamp) => {
    if (!startTimestamp) startTimestamp = timestamp;
    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
    obj.innerHTML = Math.floor(progress * (end - start) + start);
    if (progress < 1) window.requestAnimationFrame(step);
    else obj.innerHTML = end;
  };
  window.requestAnimationFrame(step);
}

function typeLabel(h) {
  if (h.type==='daily') return 'Daily Quest';
  if (h.type==='multi') return `Multi Quest • ${h.dailyTarget||1}×/day`;
  if (h.type==='weekly') return `Weekly Quest • ${h.weeklyGoal||3}d/wk`;
  if (h.type==='break') return 'Boss Battle';
  return 'Quest';
}

function burstParticles(e, color) {
  const rect = e.target.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top + rect.height / 2;
  haptic([30, 50, 30]);
  for (let i=0; i<20; i++) {
    let p = document.createElement('div');
    p.className = 'particle';
    p.style.width = p.style.height = (5 + Math.random()*4) + 'px';
    p.style.background = color;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    let angle = Math.random() * Math.PI * 2;
    let vel = 50 + Math.random() * 80;
    p.style.setProperty('--tx', Math.cos(angle) * vel + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * vel + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

function burstParticlesCenter() {
  const shapes = ['🎉','⭐','✨','🎊','🏆','💫'];
  haptic([40, 80, 40, 80, 60]);
  for (let i=0; i<40; i++) {
    let p = document.createElement('div');
    p.className = 'confetti';
    p.textContent = shapes[Math.floor(Math.random()*shapes.length)];
    let angle = Math.random() * Math.PI * 2;
    let vel = 120 + Math.random() * 260;
    p.style.setProperty('--tx', Math.cos(angle) * vel + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * vel + 'px');
    p.style.setProperty('--rot', (Math.random()*720-360) + 'deg');
    p.style.animationDelay = (Math.random()*0.15) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1300);
  }
}

function toggleToday(e) {
  const h = getHabit(activeId);
  if (!h) return;
  const today = todayKey();
  if (!h.log) h.log = {};
  if (isNeutral(h.log[today])) h.log[today] = false;
  const was = !!h.log[today];
  h.log[today] = !was;
  if (!was) burstParticles(e, h.color);
  else haptic(20);
  if (!was) { checkAchievements(h); checkShieldEarn(h); }
  renderAll();
  syncHabitToCloud(h);
}

function toggleSkip(e) {
  const h = getHabit(activeId);
  if (!h) return;
  const today = todayKey();
  if (!h.log) h.log = {};
  if (h.log[today] === 'skip') h.log[today] = false;
  else { h.log[today] = 'skip'; haptic([20, 30, 20]); }
  renderAll();
  syncHabitToCloud(h);
}

function useShield(e) {
  const h = getHabit(activeId);
  if (!h) return;
  const today = todayKey();
  if (!h.log) h.log = {};
  if (h.log[today] === 'shield') { h.log[today] = false; h.shieldBank = (h.shieldBank || 0) + 1; }
  else {
    if ((h.shieldBank || 0) < 1) { showToast('No Magic Shields left — earn more with a 7-day streak!'); return; }
    h.shieldBank -= 1;
    h.log[today] = 'shield';
    haptic([15, 40, 15]);
    showToast('Streak protected with a Magic Shield 🛡️');
  }
  renderAll();
  syncHabitToCloud(h);
}

function multiIncrement(e) {
  const h = getHabit(activeId);
  if (!h) return;
  const today = todayKey();
  if (!h.log) h.log = {};
  if (isNeutral(h.log[today])) return;
  h.log[today] = (typeof h.log[today] === 'number' ? h.log[today] : 0) + 1;
  burstParticles(e, h.color);
  checkAchievements(h);
  checkShieldEarn(h);
  renderAll();
  syncHabitToCloud(h);
}

function multiDecrement(e) {
  const h = getHabit(activeId);
  if (!h) return;
  const today = todayKey();
  if (!h.log || isNeutral(h.log[today])) return;
  h.log[today] = Math.max(0, (typeof h.log[today] === 'number' ? h.log[today] : 0) - 1);
  haptic(15);
  renderAll();
  syncHabitToCloud(h);
}

function handleDayTap(dateStr) {
  const h = getHabit(activeId);
  if (!h || dateStr > todayKey()) return;
  if (!h.log) h.log = {};
  if (h.type === 'multi') {
    if (isNeutral(h.log[dateStr])) h.log[dateStr] = 0;
    h.log[dateStr] = (typeof h.log[dateStr] === 'number' ? h.log[dateStr] : 0) + 1;
  } else {
    if (isNeutral(h.log[dateStr])) h.log[dateStr] = true;
    else h.log[dateStr] = !h.log[dateStr];
  }
  haptic(15);
  renderAll();
  syncHabitToCloud(h);
}

function startLongPress(dateStr, e) {
  longPressFired = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => { longPressFired = true; haptic(25); openNoteModal(dateStr); }, 480);
}
function cancelLongPress() { clearTimeout(longPressTimer); }
function dayClickGuarded(dateStr) { if (longPressFired) { longPressFired = false; return; } handleDayTap(dateStr); }

function openNoteModal(dateStr) {
  const h = getHabit(activeId);
  if (!h) return;
  notesEditingDate = dateStr;
  const d = new Date(dateStr + 'T00:00:00');
  document.getElementById('noteDateLabel').textContent = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  document.getElementById('noteText').value = h.notes?.[dateStr] || '';
  document.getElementById('noteDeleteBtn').classList.toggle('hidden', !h.notes?.[dateStr]);
  document.getElementById('noteModal').classList.add('open');
  renderDiaryHistory();
}
function closeNoteModal() { document.getElementById('noteModal').classList.remove('open'); notesEditingDate = null; }

function getSortedNotes(h) { return Object.entries(h.notes || {}).sort((a,b) => b[0].localeCompare(a[0])); }

function renderDiaryHistory() {
  const h = getHabit(activeId);
  const list = document.getElementById('diaryHistoryList');
  if (!h || !list) return;
  const entries = getSortedNotes(h);
  if (!entries.length) { list.innerHTML = `<div class="text-xs font-bold text-brand-muted text-center py-6">No diary entries yet. Write your first one above!</div>`; return; }
  const thisYear = new Date().getFullYear();
  list.innerHTML = entries.map(([date, text]) => {
    const d = new Date(date + 'T00:00:00');
    const label = d.toLocaleDateString('en-US', { month:'short', day:'numeric', year: d.getFullYear()!==thisYear ? 'numeric' : undefined });
    const isCurrent = date === notesEditingDate;
    return `<div class="group flex items-start gap-2 p-3 rounded-2xl border-2 ${isCurrent?'border-brand-purple bg-brand-purpleSoft':'border-brand-line bg-brand-bg'} cursor-pointer transition-all hover:border-brand-purple" onclick="selectDiaryDate('${date}')">
      <div class="flex-1 min-w-0">
        <div class="text-[10px] font-display font-extrabold uppercase tracking-wide text-brand-muted mb-0.5">${label}${date===todayKey()?' · Today':''}</div>
        <div class="text-xs font-bold text-brand-ink diary-clamp">${text.replace(/</g,'&lt;')}</div>
      </div>
      <button onclick="event.stopPropagation(); deleteHistoryEntry('${date}')" class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 text-brand-muted hover:bg-brand-redSoft hover:text-brand-red transition-colors"><i class="ph-bold ph-x text-xs"></i></button>
    </div>`;
  }).join('');
}

function selectDiaryDate(dateStr) {
  const h = getHabit(activeId);
  if (!h) return;
  notesEditingDate = dateStr;
  const d = new Date(dateStr + 'T00:00:00');
  document.getElementById('noteDateLabel').textContent = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  document.getElementById('noteText').value = h.notes?.[dateStr] || '';
  document.getElementById('noteDeleteBtn').classList.toggle('hidden', !h.notes?.[dateStr]);
  haptic(10);
  renderDiaryHistory();
}

function deleteHistoryEntry(dateStr) {
  const h = getHabit(activeId);
  if (!h || !h.notes) return;
  delete h.notes[dateStr];
  if (notesEditingDate === dateStr) { document.getElementById('noteText').value = ''; document.getElementById('noteDeleteBtn').classList.add('hidden'); }
  haptic(15);
  renderDiaryHistory();
  renderAll();
  syncHabitToCloud(h);
}

function saveNote() {
  const h = getHabit(activeId);
  if (!h || !notesEditingDate) return;
  const text = document.getElementById('noteText').value.trim();
  if (!h.notes) h.notes = {};
  if (text) h.notes[notesEditingDate] = text; else delete h.notes[notesEditingDate];
  renderDiaryHistory();
  renderAll();
  showToast('Diary entry saved!');
  syncHabitToCloud(h);
}

function deleteNote() {
  const h = getHabit(activeId);
  if (!h || !notesEditingDate || !h.notes) return;
  delete h.notes[notesEditingDate];
  document.getElementById('noteText').value = '';
  document.getElementById('noteDeleteBtn').classList.add('hidden');
  renderDiaryHistory();
  renderAll();
  showToast('Diary entry removed');
  syncHabitToCloud(h);
}

function renderCalendar(el, h) {
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const todayStr = todayKey();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const log = h.log || {};
  const notes = h.notes || {};
  const monthName = calMonth.toLocaleString('default', {month:'long', year:'numeric'});

  let days = '';
  const dows = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  days += dows.map(d => `<div class="text-[10px] md:text-xs font-display font-bold text-brand-muted text-center pb-2 uppercase">${d}</div>`).join('');
  for (let i=0; i<firstDay; i++) days += `<div></div>`;

  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isFuture = dateStr > todayStr;
    const isToday = dateStr === todayStr;
    const val = log[dateStr];
    const hasNote = !!notes[dateStr];

    let cls = 'day-cell w-full aspect-square rounded-2xl flex items-center justify-center font-display font-bold text-sm md:text-base transition-all relative ';
    let style = 'border:2px solid transparent;';

    if (isFuture) { cls += 'text-brand-muted opacity-30 cursor-default'; }
    else if (val === 'skip') { cls += 'skip-cell text-brand-orange cursor-pointer hover:scale-105'; style='border:2px solid #FFDBC4;'; }
    else if (val === 'shield') { cls += 'shield-cell text-brand-shield cursor-pointer hover:scale-105'; style='border:2px solid #C7F1FF;'; }
    else if (h.type === 'multi') {
      const target = h.dailyTarget || 1;
      if (typeof val === 'number' && val >= target) { cls += 'text-white shadow-pop hover:scale-110 cursor-pointer z-10'; style = `background:${h.color}; border:2px solid ${h.color};`; }
      else if (typeof val === 'number' && val > 0) { cls += 'cursor-pointer hover:scale-105'; style = `background:${h.color}2A; color:var(--text-main); border:2px solid ${h.color}55;`; }
      else if (dateStr < todayStr) { cls += 'border-2 border-dashed border-brand-line text-brand-muted cursor-pointer hover:bg-brand-bg hover:scale-105'; style=''; }
      else { cls += 'bg-brand-bg cursor-pointer hover:scale-105'; style='border:2px solid #F1E3C8;'; }
    } else {
      if (val === true) { cls += 'text-white shadow-pop hover:scale-110 cursor-pointer z-10'; style = `background:${h.color}; border:2px solid ${h.color};`; }
      else if (dateStr < todayStr) { cls += 'border-2 border-dashed border-brand-line text-brand-muted cursor-pointer hover:bg-brand-bg hover:scale-105'; style=''; }
      else { cls += 'bg-brand-bg cursor-pointer hover:scale-105'; style='border:2px solid #F1E3C8;'; }
    }

    if (isToday && !val) { style += ` border:2px solid ${h.color};`; }

    const handlers = isFuture ? '' : `onmousedown="startLongPress('${dateStr}', event)" onmouseup="cancelLongPress()" onmouseleave="cancelLongPress()" ontouchstart="startLongPress('${dateStr}', event)" ontouchend="cancelLongPress()" onclick="dayClickGuarded('${dateStr}')"`;
    days += `<div class="p-0.5"><div class="${cls}" style="${style}" ${handlers}>${d}${hasNote?'<span class="note-dot"></span>':''}</div></div>`;
  }

  const streak = calcStreak(h);
  const bestStreak = calcBestStreak(h);
  const shieldBank = h.shieldBank || 0;

  el.innerHTML = `<div class="max-w-xl mx-auto animate-pop w-full">
    <div class="flex items-center justify-between mb-6 bg-white p-2 rounded-full border-2 border-brand-line shadow-pop">
      <button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-brand-bg transition-transform active:scale-90" onclick="prevMonth()"><i class="ph-bold ph-caret-left"></i></button>
      <div class="font-display font-bold text-base md:text-lg">${monthName}</div>
      <button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-brand-bg transition-transform active:scale-90" onclick="nextMonth()"><i class="ph-bold ph-caret-right"></i></button>
    </div>
    <p class="text-center text-xs text-brand-muted font-bold mb-6">Tap a day to log it. Press and hold for a diary entry.</p>
    <div class="grid grid-cols-7 gap-1 md:gap-2 mb-8">${days}</div>
    <div class="grid grid-cols-3 gap-3 md:gap-4">
      <div class="bento-card bg-brand-orangeSoft p-4 md:p-6 text-center" style="border:2px solid #FFDBC4;">
        <div class="text-3xl md:text-4xl font-num font-bold mb-1 text-brand-orange">${streak}</div>
        <div class="text-[9px] md:text-xs font-display font-bold text-brand-muted uppercase tracking-wider">Streak</div>
      </div>
      <div class="bento-card bg-brand-purpleSoft p-4 md:p-6 text-center" style="border:2px solid #E4D9FF;">
        <div class="text-3xl md:text-4xl font-num font-bold mb-1 text-brand-purple">${bestStreak}</div>
        <div class="text-[9px] md:text-xs font-display font-bold text-brand-muted uppercase tracking-wider">Best ever</div>
      </div>
      <div class="bento-card bg-brand-shieldSoft p-4 md:p-6 text-center" style="border:2px solid #C7F1FF;">
        <div class="text-3xl md:text-4xl font-num font-bold mb-1 text-brand-shield">${shieldBank}</div>
        <div class="text-[9px] md:text-xs font-display font-bold text-brand-muted uppercase tracking-wider">Shields</div>
      </div>
    </div>
  </div>`;
}

function prevMonth() { calMonth.setMonth(calMonth.getMonth()-1); haptic(10); renderContent(); }
function nextMonth() { calMonth.setMonth(calMonth.getMonth()+1); haptic(10); renderContent(); }

function renderStats(el, h) {
  const log = h.log || {};
  const today = new Date();
  const cells = [];
  for (let i=363; i>=0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    const k = d.toISOString().slice(0,10);
    const val = log[k];
    let level = 0;
    if (val === 'skip') level = -1;
    else if (val === 'shield') level = -2;
    else if (val) {
      if (h.type==='multi') { const t=h.dailyTarget||1; level = typeof val==='number'?(val>=t?4:val>t/2?2:1):0; }
      else level = 4;
    }
    cells.push({k, level});
  }

  const allReps = getTotalReps(h);
  const goal = h.goal || 60;
  const pct = Math.round(Math.min(allReps/goal,1)*100);
  const daysLogged = Object.values(log).filter(v => v === true || typeof v === 'number').length;
  const dow = getDowStats(h);
  const maxDow = Math.max(0.05, ...dow.map(d=>d.rate));

  el.innerHTML = `<div class="max-w-2xl mx-auto animate-pop w-full space-y-4 md:space-y-5">
    <div class="bento-card bg-white p-5 md:p-6" style="border:2px solid #F1E3C8;">
      <div class="font-display font-bold text-sm mb-4 flex items-center gap-2"><i class="ph-fill ph-calendar-check text-brand-purple"></i> Past year activity</div>
      <div class="flex overflow-x-auto no-scrollbar gap-1 pb-2 heatmap-container">
        <div class="flex flex-col flex-wrap h-[98px] gap-1 content-start shrink-0">
          ${cells.map(c=>`<div class="w-3 h-3 rounded-[4px] cursor-pointer transition-all hover:scale-150 hover:shadow-md z-10 ${c.level===-1?'bg-brand-orange opacity-50':c.level===-2?'bg-brand-shield opacity-50':c.level===0?'bg-brand-line':''}" style="${c.level>0?`background:${h.color}; opacity:${0.3 + (c.level/4)*0.7}`:''}" onclick="handleDayTap('${c.k}')" title="${c.k}"></div>`).join('')}
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
      <div class="bento-card bg-brand-purpleSoft p-4 md:p-5" style="border:2px solid #E4D9FF;">
        <div class="text-[10px] font-display font-bold text-brand-muted uppercase tracking-wider mb-1">Total reps</div>
        <div class="text-2xl md:text-3xl font-num font-bold text-brand-purple">${allReps}</div>
      </div>
      <div class="bento-card bg-brand-greenSoft p-4 md:p-5" style="border:2px solid #C6F5E1;">
        <div class="text-[10px] font-display font-bold text-brand-muted uppercase tracking-wider mb-1">Goal reached</div>
        <div class="text-2xl md:text-3xl font-num font-bold text-brand-green">${pct}%</div>
      </div>
      <div class="bento-card bg-brand-blueSoft p-4 md:p-5" style="border:2px solid #C6EEFB;">
        <div class="text-[10px] font-display font-bold text-brand-muted uppercase tracking-wider mb-1">Active days</div>
        <div class="text-2xl md:text-3xl font-num font-bold text-brand-blue">${daysLogged}</div>
      </div>
      <div class="bento-card bg-brand-pinkSoft p-4 md:p-5" style="border:2px solid #FFD8E7;">
        <div class="text-[10px] font-display font-bold text-brand-muted uppercase tracking-wider mb-1">Reps left</div>
        <div class="text-2xl md:text-3xl font-num font-bold text-brand-pink">${goal - allReps > 0 ? goal - allReps : '✓'}</div>
      </div>
    </div>

    <div class="bento-card bg-white p-5 md:p-6" style="border:2px solid #F1E3C8;">
      <div class="font-display font-bold text-sm mb-4 flex items-center gap-2"><i class="ph-fill ph-chart-bar text-brand-purple"></i> Day-of-week pattern</div>
      <div class="flex items-end justify-between gap-2 h-32">
        ${dow.map(d => `<div class="flex-1 flex flex-col items-center justify-end gap-2 h-full">
          <div class="text-[10px] font-num font-bold text-brand-muted">${d.tracked ? Math.round(d.rate*100)+'%' : '—'}</div>
          <div class="w-full rounded-xl transition-all" style="height:${Math.max(4, (d.rate/maxDow)*100)}%; background:${d.tracked ? h.color : '#F1E3C8'}"></div>
          <div class="text-[10px] font-display font-bold text-brand-muted uppercase">${d.label.slice(0,2)}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;

  const heatmap = el.querySelector('.heatmap-container');
  if (heatmap) heatmap.scrollLeft = heatmap.scrollWidth;
}

function renderInsights(el) {
  if (!habits.length) {
    el.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center animate-pop max-w-md mx-auto">
      <div class="text-7xl mb-6 drop-shadow-xl animate-float">🔮</div>
      <h2 class="font-display text-3xl font-bold mb-3 tracking-tight">Nothing to see yet</h2>
      <p class="text-brand-muted font-bold mb-8">Add a couple of quests and log a few days to unlock insights.</p>
    </div>`;
    return;
  }
  const weeks = 8;
  const matrixRows = habits.map(h => ({ h, weekly: getWeeklyMatrix(h, weeks) }));
  const correlations = computeCorrelations();

  const header = matrixRows[0].weekly.map(w => `<div class="text-[9px] font-display font-bold text-brand-muted text-center uppercase">${w.label}</div>`).join('');
  const rows = matrixRows.map(({h, weekly}) => `
    <div class="flex items-center gap-3 py-2">
      <div class="w-28 md:w-40 shrink-0 flex items-center gap-2 min-w-0">
        <span class="text-lg shrink-0">${h.emoji}</span>
        <span class="text-xs md:text-sm font-display font-bold truncate">${h.name}</span>
      </div>
      <div class="flex-1 grid gap-1" style="grid-template-columns:repeat(${weeks},minmax(0,1fr))">
        ${weekly.map(w => `<div class="aspect-square rounded-lg" style="background:${w.tracked ? h.color : '#F1E3C8'}; opacity:${w.tracked ? 0.25 + w.rate*0.75 : 1}" title="${w.label}: ${w.tracked ? Math.round(w.rate*100)+'%' : 'no data'}"></div>`).join('')}
      </div>
    </div>`).join('');

  let corrHtml = '';
  if (correlations.length) {
    const top = correlations.slice(0, 5);
    corrHtml = top.map(c => {
      const strength = Math.abs(c.r);
      const label = strength < 0.3 ? 'a little' : strength < 0.6 ? 'noticeably' : 'strongly';
      const direction = c.r >= 0 ? 'happen together' : 'trade off';
      const barColor = c.r >= 0 ? '#8B5CF6' : '#FF5C6C';
      return `<div class="flex items-center gap-4 p-4 rounded-2xl bg-brand-bg border-2 border-brand-line">
        <div class="flex -space-x-2 shrink-0">
          <div class="w-10 h-10 rounded-full bg-white border-2 border-brand-line flex items-center justify-center text-lg">${c.a.emoji}</div>
          <div class="w-10 h-10 rounded-full bg-white border-2 border-brand-line flex items-center justify-center text-lg">${c.b.emoji}</div>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-display font-bold truncate">${c.a.name} &amp; ${c.b.name}</div>
          <div class="text-xs text-brand-muted font-bold">These ${label} ${direction}</div>
        </div>
        <div class="w-16 shrink-0 text-right">
          <div class="text-sm font-num font-bold" style="color:${barColor}">${c.r >= 0 ? '+' : ''}${c.r.toFixed(2)}</div>
        </div>
      </div>`;
    }).join('');
  } else {
    corrHtml = `<div class="p-6 rounded-2xl bg-brand-bg border-2 border-brand-line text-center text-sm text-brand-muted font-bold">Log a few more days across your quests to reveal patterns.</div>`;
  }

  el.innerHTML = `<div class="max-w-3xl mx-auto animate-pop w-full space-y-4 md:space-y-5">
    <div class="bento-card bg-white p-5 md:p-6" style="border:2px solid #F1E3C8;">
      <div class="font-display font-bold text-sm mb-1 flex items-center gap-2"><i class="ph-fill ph-squares-four text-brand-purple"></i> Completion rate matrix</div>
      <div class="text-xs text-brand-muted font-bold mb-4">Weekly completion across all quests, last ${weeks} weeks.</div>
      <div class="matrix-scroll overflow-x-auto no-scrollbar">
        <div class="min-w-[560px]">
          <div class="flex items-center gap-3 mb-1">
            <div class="w-28 md:w-40 shrink-0"></div>
            <div class="flex-1 grid gap-1" style="grid-template-columns:repeat(${weeks},minmax(0,1fr))">${header}</div>
          </div>
          ${rows}
        </div>
      </div>
    </div>

    <div class="bento-card bg-white p-5 md:p-6" style="border:2px solid #F1E3C8;">
      <div class="font-display font-bold text-sm mb-1 flex items-center gap-2"><i class="ph-fill ph-link text-brand-purple"></i> Quest connections</div>
      <div class="text-xs text-brand-muted font-bold mb-4">Based on the last 90 days of overlapping data.</div>
      <div class="space-y-2">${corrHtml}</div>
    </div>
  </div>`;
}

const ACHIEVEMENTS = [
  { reps:1, icon:'🌱', title:'First Step!', sub:'You started your quest. That\'s everything.' },
  { reps:7, icon:'🔥', title:'One Week Hero', sub:'7 reps down. Momentum is building!' },
  { reps:21, icon:'⚡', title:'Power Streak', sub:'21 reps! The habit is taking root.' },
  { reps:30, icon:'🏔️', title:'Halfway Champion', sub:'30 reps. Your future self says thanks!' },
  { reps:60, icon:'🏆', title:'Quest Mastered!', sub:'60 reps. It\'s automatic now — legendary!' },
];

function checkAchievements(h) {
  const reps = getTotalReps(h);
  for (const ach of ACHIEVEMENTS) {
    const key = `ach_${h.id}_${ach.reps}`;
    if (reps >= ach.reps && !localStorage.getItem(key)) {
      localStorage.setItem(key, '1');
      showAchievement(ach);
      break;
    }
  }
}

function showAchievement(ach) {
  const el = document.getElementById('achievement');
  document.getElementById('achIcon').textContent = ach.icon;
  document.getElementById('achTitle').textContent = ach.title;
  document.getElementById('achSub').textContent = ach.sub;
  el.classList.remove('translate-x-[150%]');
  burstParticlesCenter();
  setTimeout(() => el.classList.add('translate-x-[150%]'), 5000);
}

function openAddModal() {
  editingId = null;
  selectedEmoji = EMOJIS[0];
  selectedColor = COLORS[0];
  reminderEnabled = false;
  document.getElementById('modalTitle').textContent = 'New Quest';
  document.getElementById('hName').value = '';
  document.getElementById('hType').value = 'daily';
  document.getElementById('hGoal').value = '60';
  document.getElementById('reminderTime').value = '09:00';
  document.getElementById('deleteBtn').classList.add('hidden');
  onTypeChange();
  renderModalExtras();
  renderReminderToggle();
  document.getElementById('habitModal').classList.add('open');
  haptic(15);
}

function openEditModal() {
  const h = getHabit(activeId);
  if (!h) return;
  editingId = h.id;
  selectedEmoji = h.emoji;
  selectedColor = h.color;
  reminderEnabled = !!h.reminder?.enabled;
  document.getElementById('modalTitle').textContent = 'Edit Quest';
  document.getElementById('hName').value = h.name;
  document.getElementById('hType').value = h.type || 'daily';
  document.getElementById('hGoal').value = h.goal || 60;
  document.getElementById('reminderTime').value = h.reminder?.time || '09:00';
  document.getElementById('deleteBtn').classList.remove('hidden');
  onTypeChange(h);
  renderModalExtras();
  renderReminderToggle();
  document.getElementById('habitModal').classList.add('open');
  haptic(15);
}

function renderModalExtras() {
  const er = document.getElementById('emojiRow');
  er.innerHTML = EMOJIS.map(e => `<button class="w-11 h-11 rounded-2xl text-xl flex items-center justify-center transition-all ${e===selectedEmoji?'bg-brand-purpleSoft border-2 border-brand-purple scale-110':'bg-brand-bg border-2 border-transparent hover:scale-105'}" onclick="pickEmoji('${e}')">${e}</button>`).join('');
  const cr = document.getElementById('colorRow');
  cr.innerHTML = COLORS.map(c => `<button class="w-10 h-10 rounded-2xl shrink-0 transition-all flex items-center justify-center border-2 ${c===selectedColor?'border-brand-ink scale-110':'border-transparent hover:scale-110 shadow-sm'}" style="background:${c}" onclick="pickColor('${c}')">${c===selectedColor?'<i class="ph-bold ph-check text-white"></i>':''}</button>`).join('');
}

function pickEmoji(e) { selectedEmoji = e; haptic(10); renderModalExtras(); }
function pickColor(c) { selectedColor = c; haptic(10); renderModalExtras(); }

function renderReminderToggle() {
  document.getElementById('reminderToggle').style.background = reminderEnabled ? '#8B5CF6' : '#F1E3C8';
  document.getElementById('reminderKnob').style.transform = reminderEnabled ? 'translateX(20px)' : 'translateX(0)';
}
function toggleReminder() {
  reminderEnabled = !reminderEnabled;
  if (reminderEnabled && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  haptic(10);
  renderReminderToggle();
}

function onTypeChange() {
  const type = document.getElementById('hType').value;
  const extra = document.getElementById('typeExtra');
  const h = editingId ? getHabit(editingId) : null;
  if (type === 'multi') {
    extra.innerHTML = `<div><label class="block text-xs font-extrabold uppercase tracking-wide text-brand-muted mb-2">Daily target</label><input id="hDailyTarget" type="number" min="2" max="50" value="${h?.dailyTarget||3}" class="w-full bg-brand-bg border-2 border-brand-line rounded-2xl px-4 py-3.5 font-bold outline-none focus:border-brand-purple transition-colors"></div>`;
  } else if (type === 'weekly') {
    extra.innerHTML = `<div><label class="block text-xs font-extrabold uppercase tracking-wide text-brand-muted mb-2">Days per week</label><input id="hWeeklyGoal" type="number" min="1" max="7" value="${h?.weeklyGoal||3}" class="w-full bg-brand-bg border-2 border-brand-line rounded-2xl px-4 py-3.5 font-bold outline-none focus:border-brand-purple transition-colors"></div>`;
  } else {
    extra.innerHTML = '';
  }
}

function saveHabit() {
  const name = document.getElementById('hName').value.trim();
  if (!name) { showToast('Give your quest a name!'); return; }
  const type = document.getElementById('hType').value;
  const goal = parseInt(document.getElementById('hGoal').value) || 60;
  const time = document.getElementById('reminderTime').value || '09:00';
  const habit = editingId ? getHabit(editingId) : {};
  habit.id = habit.id || Date.now().toString(36);
  habit.name = name;
  habit.emoji = selectedEmoji;
  habit.color = selectedColor;
  habit.type = type;
  habit.goal = goal;
  habit.reminder = { enabled: reminderEnabled, time };
  if (type === 'multi') habit.dailyTarget = parseInt(document.getElementById('hDailyTarget')?.value) || 3;
  if (type === 'weekly') habit.weeklyGoal = parseInt(document.getElementById('hWeeklyGoal')?.value) || 3;
  if (!habit.log) habit.log = {};
  if (!habit.notes) habit.notes = {};
  if (habit.shieldBank === undefined) habit.shieldBank = 2;
  if (!habit.createdAt) habit.createdAt = new Date().toISOString();
  if (!editingId) habits.push(habit);
  else { const idx = habits.findIndex(h => h.id === habit.id); if (idx !== -1) habits[idx] = habit; }
  activeId = habit.id;
  closeModal();
  renderAll();
  showToast(editingId ? 'Quest updated!' : 'New quest created!');
  haptic([20, 50, 20]);
  syncHabitToCloud(habit);
}

function promptDeleteHabit() { showConfirmModal("Delete Quest", "Are you sure? This quest and its history will be gone.", () => { executeDeleteHabit(); }); }

function executeDeleteHabit() {
  const idToDelete = editingId;
  const index = habits.findIndex(h => h.id === idToDelete);
  pendingDelete = { habit: habits[index], index };
  habits = habits.filter(h => h.id !== idToDelete);
  activeId = habits[0]?.id || null;
  closeModal();
  renderAll();
  showUndoToast();
  deleteTimeout = setTimeout(() => { deleteHabitFromCloud(idToDelete); pendingDelete = null; }, 6000);
}

function handleUndo() {
  if (!pendingDelete) return;
  clearTimeout(deleteTimeout);
  habits.splice(pendingDelete.index, 0, pendingDelete.habit);
  activeId = pendingDelete.habit.id;
  pendingDelete = null;
  renderAll();
  const t = document.getElementById('toast');
  t.classList.remove('opacity-100', 'translate-y-0');
  t.classList.add('opacity-0', 'translate-y-4');
  haptic(20);
  setTimeout(() => showToast('Quest restored!'), 300);
  syncHabitToCloud(getHabit(activeId));
}

function showUndoToast() {
  const t = document.getElementById('toast');
  t.querySelector('#toastMsg').textContent = 'Quest deleted';
  document.getElementById('toastAction').style.display = 'block';
  t.classList.remove('opacity-0', 'translate-y-4');
  t.classList.add('opacity-100', 'translate-y-0');
  haptic(30);
  setTimeout(() => { t.classList.add('opacity-0', 'translate-y-4'); setTimeout(()=>{document.getElementById('toastAction').style.display='none';},300); }, 5000);
}

function closeModal() { document.getElementById('habitModal').classList.remove('open'); }
function closeModalOutside(e) { if (e.target.classList.contains('modal-overlay')) { closeModal(); closeConfirmModal(); closeNoteModal(); closeSettingsModal(); } }

function selectHabit(id) { activeId = id; haptic(10); renderAll(); }

function setView(v, btn, bottomBtn) {
  currentView = v;
  haptic(10);
  renderContent();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.querySelector('#toastMsg').textContent = msg;
  document.getElementById('toastAction').style.display = 'none';
  t.classList.remove('opacity-0', 'translate-y-4');
  t.classList.add('opacity-100', 'translate-y-0');
  setTimeout(() => { t.classList.remove('opacity-100', 'translate-y-0'); t.classList.add('opacity-0', 'translate-y-4'); }, 3000);
}

function setDatePill() {
  const d = new Date();
  document.getElementById('datePill').querySelector('span').textContent = d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}

function renderAll() {
  renderSidebar();
  renderMobileStrip();
  renderContent();
}

function registerServiceWorker() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then((reg) => { swRegistration = reg; }).catch(() => {});
  }
}

function checkReminders() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const today = todayKey();
  for (const h of habits) {
    if (!h.reminder?.enabled || h.reminder.time !== hhmm) continue;
    if (isCheckedToday(h)) continue;
    const flagKey = `reminded_${h.id}_${today}`;
    if (localStorage.getItem(flagKey)) continue;
    localStorage.setItem(flagKey, '1');
    const title = `${h.emoji} ${h.name}`;
    const body = "Your quest is waiting! Log it to keep your streak alive.";
    if (swRegistration) {
      navigator.serviceWorker.ready.then((reg) => reg.active && reg.active.postMessage({ type: 'SHOW_REMINDER', title, body, tag: h.id }));
    } else {
      try { new Notification(title, { body, icon: 'icons/icon-192.png' }); } catch (e) {}
    }
  }
}

function boot() {
  registerServiceWorker();
  setDatePill();
  checkSetup();
  setInterval(checkReminders, 30000);
}

boot();
</script>
