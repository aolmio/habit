<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>!HABITS - Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #09090F;
    --bg2: #111118;
    --bg3: #1A1A24;
    --border: #2A2A38;
    --text: #F0EFE8;
    --muted: #6B6B80;
    --mono: 'Space Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

  /* ── Layout ── */
  .app { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 260px; min-width: 260px; background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: transform .3s;
  }

  .sidebar-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    letter-spacing: .15em; color: var(--muted);
  }
  .logo span { color: var(--text); }

  .habit-list { flex: 1; overflow-y: auto; padding: 12px 8px; }
  .habit-list::-webkit-scrollbar { width: 4px; }
  .habit-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .habit-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    transition: background .15s; margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .habit-item:hover { background: var(--bg3); }
  .habit-item.active { background: var(--bg3); border-color: var(--border); }

  .habit-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }

  .habit-meta { flex: 1; min-width: 0; }
  .habit-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .habit-progress-text { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; }

  .mini-bar { height: 2px; background: var(--border); border-radius: 1px; margin-top: 4px; }
  .mini-bar-fill { height: 100%; border-radius: 1px; transition: width .4s; }

  .add-btn {
    margin: 12px; padding: 12px;
    background: transparent; border: 1px dashed var(--border);
    border-radius: 10px; color: var(--muted); font-family: var(--sans);
    font-size: 13px; cursor: pointer; transition: all .2s;
    display: flex; align-items: center; gap: 8px;
  }
  .add-btn:hover { border-color: var(--text); color: var(--text); }

  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    padding: 20px 32px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .menu-btn {
    display: none; background: none; border: none; color: var(--text);
    cursor: pointer; font-size: 20px; padding: 4px;
  }

  .date-pill {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: var(--bg3); padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border);
  }

  .view-tabs {
    display: flex; gap: 4px; background: var(--bg3);
    padding: 4px; border-radius: 10px; border: 1px solid var(--border);
  }
  .tab-btn {
    padding: 6px 14px; border-radius: 7px; border: none;
    background: transparent; color: var(--muted);
    font-family: var(--sans); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all .2s;
  }
  .tab-btn.active { background: var(--bg); color: var(--text); }

  .content { flex: 1; overflow-y: auto; padding: 40px 32px; position: relative; }
  .content::-webkit-scrollbar { width: 4px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Loading State */
  .loader-wrap {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: var(--bg);
    z-index: 10; gap: 16px; font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .spinner {
    width: 24px; height: 24px; border: 2px solid var(--border);
    border-top-color: var(--text); border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Empty state ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; gap: 16px; text-align: center;
  }
  .empty-icon { font-size: 64px; opacity: .3; }
  .empty-title { font-size: 22px; font-weight: 600; color: var(--muted); }
  .empty-sub { font-size: 14px; color: var(--muted); max-width: 300px; line-height: 1.6; }

  /* ── Today View ── */
  .today-view { max-width: 540px; margin: 0 auto; }

  .habit-hero { text-align: center; margin-bottom: 48px; }
  .hero-emoji { font-size: 48px; margin-bottom: 12px; display: block; }
  .hero-title {
    font-size: 32px; font-weight: 700; letter-spacing: -.02em;
    margin-bottom: 6px;
  }
  .hero-type {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase;
  }

  /* The arc */
  .arc-wrap {
    position: relative; width: 260px; height: 260px;
    margin: 0 auto 40px; display: flex;
    align-items: center; justify-content: center;
  }
  .arc-svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
  .arc-bg { stroke: var(--border); fill: none; }
  .arc-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }

  .arc-inner {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
  }
  .rep-count {
    font-family: var(--mono); font-size: 56px; font-weight: 700;
    line-height: 1; letter-spacing: -.04em;
  }
  .rep-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .15em; margin-top: 4px; }
  .rep-goal { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Check button */
  .check-area { display: flex; flex-direction: column; align-items: center; gap: 16px; }

  .check-btn {
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; transition: transform .15s, opacity .15s;
    background: transparent; position: relative; overflow: hidden;
  }
  .check-btn:hover { transform: scale(1.06); }
  .check-btn:active { transform: scale(.96); }
  .check-btn.done { opacity: .5; }
  .check-btn.pop { animation: pop .35s cubic-bezier(.175,.885,.32,1.275); }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  .check-ripple {
    position: absolute; border-radius: 50%;
    width: 100%; height: 100%; opacity: 0;
    animation: ripple .5s ease-out forwards;
  }
  @keyframes ripple {
    0% { transform: scale(0); opacity: .5; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  .check-label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .1em; }

  /* multi-daily counter */
  .multi-controls {
    display: flex; align-items: center; gap: 20px;
    background: var(--bg3); padding: 16px 24px;
    border-radius: 16px; border: 1px solid var(--border);
  }
  .count-btn {
    width: 40px; height: 40px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg2);
    color: var(--text); font-size: 20px; cursor: pointer;
    transition: all .15s; display: flex; align-items: center; justify-content: center;
  }
  .count-btn:hover { background: var(--bg3); border-color: var(--text); }
  .count-btn:disabled { opacity: .3; cursor: not-allowed; }
  .count-today {
    font-family: var(--mono); font-size: 28px; font-weight: 700;
    min-width: 60px; text-align: center;
  }
  .count-target { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }

  /* progress section */
  .progress-section { margin-top: 48px; }
  .section-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .15em;
    color: var(--muted); text-transform: uppercase; margin-bottom: 16px;
  }

  /* level journey */
  .levels { display: flex; gap: 6px; flex-wrap: wrap; }
  .level-block {
    flex: 1; min-width: 30px; height: 6px; border-radius: 3px;
    background: var(--border); transition: background .3s;
  }
  .level-block.current { animation: pulse-level 1.5s ease-in-out infinite; }
  @keyframes pulse-level { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

  .journey-msg {
    margin-top: 16px; padding: 16px; background: var(--bg3);
    border-radius: 12px; border-left: 3px solid;
    font-size: 13px; line-height: 1.6; color: var(--muted);
  }

  /* ── Calendar View ── */
  .cal-view { max-width: 640px; margin: 0 auto; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .cal-nav { background: none; border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: all .2s; }
  .cal-nav:hover { background: var(--bg3); }
  .cal-month { font-family: var(--mono); font-size: 14px; font-weight: 700; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; padding: 4px 0; letter-spacing: .05em; }
  .cal-day {
    aspect-ratio: 1; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-family: var(--mono); cursor: default;
    border: 1px solid transparent; transition: all .2s;
  }
  .cal-day.empty { background: transparent; }
  .cal-day.future { color: var(--border); }
  .cal-day.today { border-color: var(--border); }
  .cal-day.done { color: #000; font-weight: 700; }
  .cal-day.missed { background: var(--bg3); color: var(--muted); }

  .cal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 32px; }
  .stat-card {
    background: var(--bg3); border-radius: 12px; padding: 16px;
    border: 1px solid var(--border); text-align: center;
  }
  .stat-num { font-family: var(--mono); font-size: 28px; font-weight: 700; }
  .stat-lbl { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .1em; margin-top: 4px; }

  /* ── Stats View ── */
  .stats-view { max-width: 640px; margin: 0 auto; }
  .heatmap { display: grid; grid-template-columns: repeat(52, 1fr); gap: 3px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 4px; }
  .heat-cell {
    width: 12px; height: 12px; border-radius: 2px; background: var(--bg3);
    transition: background .2s;
  }
  .heat-cell.l1 { opacity: .4; }
  .heat-cell.l2 { opacity: .65; }
  .heat-cell.l3 { opacity: .85; }
  .heat-cell.l4 { opacity: 1; }

  /* ── Modal ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px; width: 420px; max-width: 94vw;
    transform: scale(.95); transition: transform .2s;
  }
  .overlay.open .modal { transform: scale(1); }

  .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; }

  .form-field { margin-bottom: 18px; }
  .form-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; display: block; }

  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 11px 14px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: var(--sans); font-size: 14px;
    outline: none; transition: border-color .2s;
  }
  .form-input:focus, .form-select:focus { border-color: var(--text); }
  .form-select { appearance: none; cursor: pointer; }
  .form-select option { background: var(--bg2); }

  .emoji-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .emoji-btn {
    width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg3); font-size: 20px; cursor: pointer;
    transition: all .15s; display: flex; align-items: center; justify-content: center;
  }
  .emoji-btn:hover { border-color: var(--text); transform: scale(1.1); }
  .emoji-btn.selected { border-color: var(--text); background: var(--bg); }

  .color-row { display: flex; gap: 8px; }
  .color-dot {
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: all .15s;
  }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.selected { border-color: var(--text); }

  .form-row { display: flex; gap: 12px; }
  .form-row .form-field { flex: 1; }

  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 10px; border: none;
    font-family: var(--sans); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .2s;
  }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-primary:hover { opacity: .9; }
  .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--text); }
  .btn-danger { background: #3A1A1A; color: #FF6B6B; border: 1px solid #5A2A2A; }
  .btn-danger:hover { background: #4A2020; }

  /* toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 20px;
    border-radius: 50px; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: all .3s; z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* achievement flash */
  .achievement {
    position: fixed; top: 24px; right: 24px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    transform: translateX(120%); transition: transform .4s cubic-bezier(.175,.885,.32,1.275);
    z-index: 200; max-width: 280px;
  }
  .achievement.show { transform: translateX(0); }
  .ach-icon { font-size: 32px; }
  .ach-title { font-size: 12px; font-weight: 700; color: var(--text); }
  .ach-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* responsive */
  @media (max-width: 640px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(-100%); }
    .sidebar.open { transform: none; }
    .menu-btn { display: block; }
    .content { padding: 24px 16px; }
    .topbar { padding: 16px; }
    .arc-wrap { width: 220px; height: 220px; }
    .rep-count { font-size: 44px; }
    .cal-stats { grid-template-columns: repeat(3,1fr); }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">!<span>HABITS</span></div>
    </div>
    <div class="habit-list" id="habitList"></div>
    <button class="add-btn" onclick="openAddModal()">
      <span>＋</span> New habit
    </button>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="date-pill" id="datePill"></div>
      </div>
      <div class="view-tabs">
        <button class="tab-btn active" onclick="setView('today', this)">Today</button>
        <button class="tab-btn" onclick="setView('calendar', this)">Calendar</button>
        <button class="tab-btn" onclick="setView('stats', this)">Stats</button>
        <button class="tab-btn" onclick="resetKeys()" style="margin-left: 20px; color: #FF6B6B;">Log Out</button>
      </div>
    </div>
    <div class="content" id="content">
        <div class="loader-wrap" id="loader">
            <div class="spinner"></div>
            <div>Syncing with cloud...</div>
        </div>
    </div>
  </div>
</div>

<div class="overlay" id="habitModal" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">New Habit</div>
    <div class="form-field">
      <label class="form-label">Name</label>
      <input class="form-input" id="hName" placeholder="e.g. Meditate, No alcohol…" maxlength="40">
    </div>
    <div class="form-field">
      <label class="form-label">Icon</label>
      <div class="emoji-row" id="emojiRow"></div>
    </div>
    <div class="form-field">
      <label class="form-label">Accent Color</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="form-field">
      <label class="form-label">Habit Type</label>
      <select class="form-select" id="hType" onchange="onTypeChange()">
        <option value="daily">Daily — once per day</option>
        <option value="multi">Multi-Daily — multiple times per day</option>
        <option value="weekly">Weekly — X days per week</option>
        <option value="break">Break a habit — track days avoided</option>
      </select>
    </div>
    <div id="typeExtra"></div>
    <div class="form-field">
      <label class="form-label">Goal (reps to form habit)</label>
      <input class="form-input" id="hGoal" type="number" min="1" max="365" value="60" placeholder="60">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="deleteBtn" style="display:none" onclick="deleteCurrentHabit()">Delete</button>
      <button class="btn btn-primary" onclick="saveHabit()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="achievement" id="achievement">
  <div class="ach-icon" id="achIcon"></div>
  <div>
    <div class="ach-title" id="achTitle"></div>
    <div class="ach-sub" id="achSub"></div>
  </div>
</div>

<script>
// ── Secure Configuration via Prompt ──
let sbUrl = localStorage.getItem('SB_URL');
let sbKey = localStorage.getItem('SB_KEY');

// If missing, prompt user before the app loads
if (!sbUrl || !sbKey) {
  sbUrl = prompt("Welcome! Please enter your Supabase Project URL:");
  sbKey = prompt("Please enter your Supabase Anon Public Key:");
  
  if (sbUrl && sbKey) {
    localStorage.setItem('SB_URL', sbUrl.trim());
    localStorage.setItem('SB_KEY', sbKey.trim());
  } else {
    document.body.innerHTML = '<div style="color:white; text-align:center; padding: 40px; font-family: monospace;">Database credentials required. Refresh to try again.</div>';
    throw new Error("Missing Supabase credentials");
  }
}

// Initialize Supabase Client
const _supabase = supabase.createClient(sbUrl, sbKey);

// ── Constants ──
const COLORS = ['#FF6B6B','#FF9F43','#F9CA24','#6AB04C','#22A6B3','#7D5FFF','#E056FD','#F0A500'];
const EMOJIS = ['🧘','🏃','📚','✍️','💧','🥗','🚭','🍺','🎨','🎵','💊','🧹','📵','💪','🛌','🌿','🧠','❤️','🎯','⚡'];
const JOURNEY = [
  "Every journey begins with a single step. You've taken it.",
  "The first week is the hardest. Keep showing up.",
  "You're building momentum. The compound effect is real.",
  "A month in. This is starting to feel like you.",
  "Halfway there. Your future self is watching.",
  "The home stretch. This is who you are now.",
  "One last push. 60 reps and this habit is yours forever.",
  "🎉 Habit formed. You did it. Now it's automatic."
];

// ── State ──
let habits = []; // Now loaded from cloud
let activeId = null;
let currentView = 'today';
let editingId = null;
let selectedEmoji = EMOJIS[0];
let selectedColor = COLORS[0];
let calMonth = new Date();

// ── Cloud Sync Methods ──

// Load all habits from Supabase
async function loadDataFromCloud() {
  const { data, error } = await _supabase
    .from('habits')
    .select('*')
    .order('createdAt', { ascending: true });

  if (error) {
    console.error("Error fetching habits:", error);
    showToast("Failed to sync with cloud");
    return;
  }

  habits = data || [];
  if (habits.length > 0 && !activeId) activeId = habits[0].id;
  
  // Remove Loader
  const loader = document.getElementById('loader');
  if(loader) loader.remove();
  
  renderAll();
}

// Save or Update a single habit in Supabase (Called in background for optimistic UI)
async function syncHabitToCloud(habit) {
  const { error } = await _supabase
    .from('habits')
    .upsert(habit);

  if (error) {
    console.error("Error syncing habit:", error);
    showToast("Cloud save failed");
  }
}

// Delete a habit in Supabase
async function deleteHabitFromCloud(id) {
  const { error } = await _supabase
    .from('habits')
    .delete()
    .eq('id', id);

  if (error) {
    console.error("Error deleting habit:", error);
    showToast("Cloud delete failed");
  }
}

// Utility to clear keys if you want to switch databases
function resetKeys() {
    if(confirm("Log out and clear database keys from this device?")) {
        localStorage.removeItem('SB_URL');
        localStorage.removeItem('SB_KEY');
        window.location.reload();
    }
}

// ── Helper Logic ──
function getHabit(id) { return habits.find(h => h.id === id); }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getTotalReps(h) {
  if (!h.log) return 0;
  if (h.type === 'daily' || h.type === 'break') {
    return Object.values(h.log).filter(v => v).length;
  }
  if (h.type === 'multi') {
    return Object.values(h.log).reduce((s, v) => s + (v || 0), 0);
  }
  if (h.type === 'weekly') {
    let reps = 0;
    const weeks = groupByWeek(h.log);
    for (const [, days] of Object.entries(weeks)) {
      if (days >= (h.weeklyGoal || 3)) reps++;
    }
    return reps;
  }
  return 0;
}

function groupByWeek(log) {
  const weeks = {};
  for (const [date, val] of Object.entries(log)) {
    if (!val) continue;
    const d = new Date(date + 'T00:00:00');
    const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7));
    const wk = mon.toISOString().slice(0,10);
    weeks[wk] = (weeks[wk] || 0) + 1;
  }
  return weeks;
}

function getProgress(h) {
  return Math.min(getTotalReps(h) / (h.goal || 60), 1);
}

function isCheckedToday(h) {
  const today = todayKey();
  if (h.type === 'multi') return (h.log?.[today] || 0) >= (h.dailyTarget || 1);
  return !!h.log?.[today];
}

function getLevel(h) {
  const reps = getTotalReps(h);
  const goal = h.goal || 60;
  return Math.min(7, Math.floor(reps / goal * 8));
}

// ── Render Sidebar ──
function renderSidebar() {
  const list = document.getElementById('habitList');
  if (!habits.length) { list.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:13px;text-align:center">No habits yet</div>'; return; }
  list.innerHTML = habits.map(h => {
    const pct = getProgress(h) * 100;
    const reps = getTotalReps(h);
    const goal = h.goal || 60;
    return `<div class="habit-item${h.id===activeId?' active':''}" onclick="selectHabit('${h.id}')">
      <div class="habit-icon">${h.emoji}</div>
      <div class="habit-meta">
        <div class="habit-name">${h.name}</div>
        <div class="habit-progress-text">${reps}/${goal} reps</div>
        <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%;background:${h.color}"></div></div>
      </div>
    </div>`;
  }).join('');
}

// ── Main Render ──
function renderContent() {
  const el = document.getElementById('content');
  const h = getHabit(activeId);
  if (!habits.length || !h) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🌱</div>
      <div class="empty-title">No habits yet</div>
      <div class="empty-sub">Start small. One habit at a time. Science says 60 reps makes it stick.</div>
      <button class="btn btn-primary" style="width:auto;padding:12px 28px;margin-top:8px" onclick="openAddModal()">Add your first habit</button>
    </div>`;
    return;
  }
  if (currentView === 'today') renderToday(el, h);
  else if (currentView === 'calendar') renderCalendar(el, h);
  else renderStats(el, h);
}

// ── Today View ──
function renderToday(el, h) {
  const reps = getTotalReps(h);
  const goal = h.goal || 60;
  const pct = Math.min(reps / goal, 1);
  const level = getLevel(h);
  const today = todayKey();
  const checkedToday = isCheckedToday(h);

  const R = 110; const C = 130; const stroke = 8;
  const circ = 2 * Math.PI * R;
  const dash = circ * pct;

  let checkArea = '';
  if (h.type === 'multi') {
    const cnt = h.log?.[today] || 0;
    const target = h.dailyTarget || 1;
    checkArea = `<div class="multi-controls">
      <button class="count-btn" onclick="multiDecrement()" ${cnt===0?'disabled':''}>−</button>
      <div>
        <div class="count-today">${cnt}</div>
        <div class="count-target">of ${target} today</div>
      </div>
      <button class="count-btn" onclick="multiIncrement()">＋</button>
    </div>`;
  } else {
    const label = h.type === 'break' ? (checkedToday ? 'Avoided today ✓' : 'Mark as avoided') :
                  h.type === 'weekly' ? (checkedToday ? 'Done today ✓' : 'Log for today') :
                  (checkedToday ? 'Done today ✓' : 'Mark as done');
    checkArea = `<button class="check-btn${checkedToday?' done':''}" id="checkBtn"
      style="border-color:${h.color};color:${h.color}" onclick="toggleToday()">
      ${checkedToday ? '✓' : '○'}
    </button>
    <div class="check-label">${label}</div>`;
  }

  const levelBlocks = Array.from({length:8}, (_,i) => {
    const cls = i < level ? 'done' : i === level ? 'current' : '';
    return `<div class="level-block ${cls}" style="${i<level?'background:'+h.color:''}${i===level?'background:'+h.color+';':''}"></div>`;
  }).join('');

  const journeyMsg = JOURNEY[Math.min(level, 7)];

  el.innerHTML = `<div class="today-view">
    <div class="habit-hero">
      <span class="hero-emoji">${h.emoji}</span>
      <div class="hero-title">${h.name}</div>
      <div class="hero-type">${typeLabel(h)}</div>
      <button style="margin-top:10px;background:none;border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:20px;font-size:11px;cursor:pointer;font-family:var(--mono);letter-spacing:.08em" onclick="openEditModal()">EDIT</button>
    </div>

    <div class="arc-wrap">
      <svg class="arc-svg" width="260" height="260" viewBox="0 0 260 260">
        <circle class="arc-bg" cx="130" cy="130" r="${R}" stroke-width="${stroke}"/>
        <circle class="arc-fill" cx="130" cy="130" r="${R}" stroke-width="${stroke}"
          stroke="${h.color}"
          stroke-dasharray="${dash} ${circ}"
          stroke-dashoffset="0"/>
      </svg>
      <div class="arc-inner">
        <div class="rep-count" style="color:${h.color}">${reps}</div>
        <div class="rep-label">REPS</div>
        <div class="rep-goal">/ ${goal} to form</div>
      </div>
    </div>

    <div class="check-area" id="checkArea">${checkArea}</div>

    <div class="progress-section">
      <div class="section-label">Your Journey — Level ${level+1} of 8</div>
      <div class="levels">${levelBlocks}</div>
      <div class="journey-msg" style="border-color:${h.color}">${journeyMsg}</div>
    </div>
  </div>`;
}

function typeLabel(h) {
  if (h.type==='daily') return 'DAILY HABIT';
  if (h.type==='multi') return `MULTI-DAILY — ${h.dailyTarget||1}× PER DAY`;
  if (h.type==='weekly') return `WEEKLY — ${h.weeklyGoal||3} DAYS PER WEEK`;
  if (h.type==='break') return 'BREAK THIS HABIT';
  return 'HABIT';
}

// ── Interaction Handlers (Optimistic UI updates) ──

function toggleToday() {
  const h = getHabit(activeId);
  if (!h) return;
  const today = todayKey();
  if (!h.log) h.log = {};
  
  const was = !!h.log[today];
  h.log[today] = !was;
  
  // 1. Instantly update UI
  renderAll();
  
  // 2. Trigger animation if checked
  const btn = document.getElementById('checkBtn');
  if (btn && !was) {
    btn.classList.add('pop');
    const rip = document.createElement('div');
    rip.className = 'check-ripple';
    rip.style.background = h.color;
    btn.appendChild(rip);
    setTimeout(() => rip.remove(), 500);
    btn.addEventListener('animationend', () => btn.classList.remove('pop'), {once:true});
    checkAchievements(h);
  }
  
  // 3. Sync to Cloud in background
  syncHabitToCloud(h);
}

function multiIncrement() {
  const h = getHabit(activeId);
  if (!h) return;
  const today = todayKey();
  if (!h.log) h.log = {};
  
  h.log[today] = (h.log[today] || 0) + 1;
  
  renderAll();
  checkAchievements(h);
  syncHabitToCloud(h); // Background sync
}

function multiDecrement() {
  const h = getHabit(activeId);
  if (!h) return;
  const today = todayKey();
  if (!h.log) return;
  
  h.log[today] = Math.max(0, (h.log[today] || 0) - 1);
  
  renderAll();
  syncHabitToCloud(h); // Background sync
}

// ── Calendar View ──
function renderCalendar(el, h) {
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const today = new Date();
  const todayStr = todayKey();

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const log = h.log || {};

  const monthName = calMonth.toLocaleString('default', {month:'long', year:'numeric'});

  let days = '';
  const dows = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  days += dows.map(d => `<div class="cal-dow">${d}</div>`).join('');

  for (let i=0; i<firstDay; i++) days += `<div class="cal-day empty"></div>`;

  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isFuture = dateStr > todayStr;
    const isToday = dateStr === todayStr;
    const val = log[dateStr];

    let cls = 'cal-day';
    let bg = '';
    let style = '';

    if (isFuture) { cls += ' future'; }
    else if (h.type === 'multi') {
      const target = h.dailyTarget || 1;
      if (val >= target) { cls += ' done'; bg = h.color; style = `background:${h.color};`; }
      else if (val > 0) { cls += ' partial'; style = `background:${h.color}55;`; }
      else if (!isFuture && dateStr < todayStr) { cls += ' missed'; }
    } else {
      if (val) { cls += ' done'; style = `background:${h.color};`; }
      else if (!isFuture && dateStr < todayStr) { cls += ' missed'; }
    }

    if (isToday) cls += ' today';
    days += `<div class="${cls}" style="${style}">${d}</div>`;
  }

  const totalDone = Object.values(log).filter(v => v).length;
  const streak = calcStreak(h);
  const bestStreak = calcBestStreak(h);

  el.innerHTML = `<div class="cal-view">
    <div class="cal-header">
      <button class="cal-nav" onclick="prevMonth()">‹</button>
      <div class="cal-month">${monthName}</div>
      <button class="cal-nav" onclick="nextMonth()">›</button>
    </div>
    <div class="cal-grid">${days}</div>
    <div class="cal-stats">
      <div class="stat-card">
        <div class="stat-num" style="color:${h.color}">${totalDone}</div>
        <div class="stat-lbl">TOTAL REPS</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:${h.color}">${streak}</div>
        <div class="stat-lbl">STREAK</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:${h.color}">${bestStreak}</div>
        <div class="stat-lbl">BEST STREAK</div>
      </div>
    </div>
  </div>`;
}

function prevMonth() { calMonth.setMonth(calMonth.getMonth()-1); renderContent(); }
function nextMonth() { calMonth.setMonth(calMonth.getMonth()+1); renderContent(); }

function calcStreak(h) {
  const log = h.log || {};
  let streak = 0;
  const d = new Date(); 
  while (true) {
    const k = d.toISOString().slice(0,10);
    if (log[k]) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function calcBestStreak(h) {
  const log = h.log || {};
  const dates = Object.keys(log).filter(k => log[k]).sort();
  if (!dates.length) return 0;
  let best = 1, cur = 1;
  for (let i=1; i<dates.length; i++) {
    const prev = new Date(dates[i-1]+'T00:00:00');
    const curr = new Date(dates[i]+'T00:00:00');
    const diff = (curr - prev) / 86400000;
    if (diff === 1) { cur++; best = Math.max(best, cur); }
    else cur = 1;
  }
  return best;
}

// ── Stats View ──
function renderStats(el, h) {
  const log = h.log || {};
  const today = new Date();
  const cells = [];
  for (let i=363; i>=0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    const k = d.toISOString().slice(0,10);
    const val = log[k];
    let level = 0;
    if (val) {
      if (h.type==='multi') { const t=h.dailyTarget||1; level = val>=t?4:val>t/2?2:1; }
      else level = 4;
    }
    cells.push({k, level});
  }

  const allReps = getTotalReps(h);
  const goal = h.goal || 60;
  const pct = Math.round(Math.min(allReps/goal,1)*100);
  const streak = calcStreak(h);
  const best = calcBestStreak(h);
  const daysLogged = Object.values(log).filter(v=>v).length;

  el.innerHTML = `<div class="stats-view">
    <div style="margin-bottom:32px">
      <div class="section-label">Last 52 weeks</div>
      <div class="heatmap">
        ${cells.map(c=>`<div class="heat-cell${c.level?' l'+c.level:''}" style="${c.level?'background:'+h.color:''}"></div>`).join('')}
      </div>
    </div>

    <div class="cal-stats" style="margin-bottom:24px">
      <div class="stat-card"><div class="stat-num" style="color:${h.color}">${allReps}</div><div class="stat-lbl">TOTAL REPS</div></div>
      <div class="stat-card"><div class="stat-num" style="color:${h.color}">${pct}%</div><div class="stat-lbl">COMPLETE</div></div>
      <div class="stat-card"><div class="stat-num" style="color:${h.color}">${daysLogged}</div><div class="stat-lbl">DAYS LOGGED</div></div>
    </div>

    <div class="cal-stats">
      <div class="stat-card"><div class="stat-num" style="color:${h.color}">${streak}</div><div class="stat-lbl">STREAK</div></div>
      <div class="stat-card"><div class="stat-num" style="color:${h.color}">${best}</div><div class="stat-lbl">BEST STREAK</div></div>
      <div class="stat-card"><div class="stat-num" style="color:${h.color}">${goal - allReps > 0 ? goal - allReps : '✓'}</div><div class="stat-lbl">REPS LEFT</div></div>
    </div>
  </div>`;
}

// ── Achievements ──
const ACHIEVEMENTS = [
  { reps:1, icon:'🌱', title:'First Step', sub:'You started. That\'s everything.' },
  { reps:7, icon:'🔥', title:'One Week In', sub:'7 reps. The hardest part is behind you.' },
  { reps:21, icon:'⚡', title:'Three Weeks', sub:'You\'re building momentum.' },
  { reps:30, icon:'🏔️', title:'Halfway', sub:'30 reps. Your future self is proud.' },
  { reps:60, icon:'🏆', title:'Habit Formed!', sub:'60 reps. It\'s automatic now.' },
];

function checkAchievements(h) {
  const reps = getTotalReps(h);
  for (const ach of ACHIEVEMENTS) {
    const key = `ach_${h.id}_${ach.reps}`;
    if (reps >= ach.reps && !localStorage.getItem(key)) {
      localStorage.setItem(key, '1');
      showAchievement(ach);
      break;
    }
  }
}

function showAchievement(ach) {
  const el = document.getElementById('achievement');
  document.getElementById('achIcon').textContent = ach.icon;
  document.getElementById('achTitle').textContent = ach.title;
  document.getElementById('achSub').textContent = ach.sub;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Modal ──
function openAddModal() {
  editingId = null;
  selectedEmoji = EMOJIS[0];
  selectedColor = COLORS[0];
  document.getElementById('modalTitle').textContent = 'New Habit';
  document.getElementById('hName').value = '';
  document.getElementById('hType').value = 'daily';
  document.getElementById('hGoal').value = '60';
  document.getElementById('deleteBtn').style.display = 'none';
  onTypeChange();
  renderModalExtras();
  document.getElementById('habitModal').classList.add('open');
  setTimeout(() => document.getElementById('hName').focus(), 200);
}

function openEditModal() {
  const h = getHabit(activeId);
  if (!h) return;
  editingId = h.id;
  selectedEmoji = h.emoji;
  selectedColor = h.color;
  document.getElementById('modalTitle').textContent = 'Edit Habit';
  document.getElementById('hName').value = h.name;
  document.getElementById('hType').value = h.type || 'daily';
  document.getElementById('hGoal').value = h.goal || 60;
  document.getElementById('deleteBtn').style.display = 'block';
  onTypeChange(h);
  renderModalExtras();
  document.getElementById('habitModal').classList.add('open');
}

function renderModalExtras() {
  const er = document.getElementById('emojiRow');
  er.innerHTML = EMOJIS.map(e => `<button class="emoji-btn${e===selectedEmoji?' selected':''}" onclick="pickEmoji('${e}')">${e}</button>`).join('');
  const cr = document.getElementById('colorRow');
  cr.innerHTML = COLORS.map(c => `<div class="color-dot${c===selectedColor?' selected':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('');
}

function pickEmoji(e) {
  selectedEmoji = e;
  document.querySelectorAll('.emoji-btn').forEach(b => b.classList.toggle('selected', b.textContent===e));
}

function pickColor(c) {
  selectedColor = c;
  document.querySelectorAll('.color-dot').forEach(b => b.classList.toggle('selected', b.style.background===c || b.style.backgroundColor===c));
}

function onTypeChange(h) {
  const type = document.getElementById('hType').value;
  const extra = document.getElementById('typeExtra');
  if (type === 'multi') {
    extra.innerHTML = `<div class="form-field">
      <label class="form-label">Daily Target (times per day)</label>
      <input class="form-input" id="hDailyTarget" type="number" min="2" max="50" value="${h?.dailyTarget||3}" placeholder="3">
    </div>`;
  } else if (type === 'weekly') {
    extra.innerHTML = `<div class="form-field">
      <label class="form-label">Days per week</label>
      <input class="form-input" id="hWeeklyGoal" type="number" min="1" max="7" value="${h?.weeklyGoal||3}" placeholder="3">
    </div>`;
  } else {
    extra.innerHTML = '';
  }
}

function saveHabit() {
  const name = document.getElementById('hName').value.trim();
  if (!name) { showToast('Please enter a name'); return; }
  const type = document.getElementById('hType').value;
  const goal = parseInt(document.getElementById('hGoal').value) || 60;

  const habit = editingId ? getHabit(editingId) : {};
  habit.id = habit.id || Date.now().toString(36);
  habit.name = name;
  habit.emoji = selectedEmoji;
  habit.color = selectedColor;
  habit.type = type;
  habit.goal = goal;
  if (type === 'multi') habit.dailyTarget = parseInt(document.getElementById('hDailyTarget')?.value) || 3;
  if (type === 'weekly') habit.weeklyGoal = parseInt(document.getElementById('hWeeklyGoal')?.value) || 3;
  if (!habit.log) habit.log = {};
  if (!habit.createdAt) habit.createdAt = new Date().toISOString();

  // Optimistic UI update
  if (!editingId) {
    habits.push(habit);
  } else {
    const idx = habits.findIndex(h => h.id === habit.id);
    if(idx !== -1) habits[idx] = habit;
  }
  
  activeId = habit.id;
  closeModal();
  renderAll();
  showToast(editingId ? 'Habit updated' : 'Habit created!');

  // Sync in background
  syncHabitToCloud(habit);
}

function deleteCurrentHabit() {
  if (!confirm('Delete this habit and all its data?')) return;
  
  const idToDelete = editingId;
  
  // Optimistic UI update
  habits = habits.filter(h => h.id !== idToDelete);
  activeId = habits[0]?.id || null;
  
  closeModal();
  renderAll();
  showToast('Habit deleted');

  // Sync in background
  deleteHabitFromCloud(idToDelete);
}

function closeModal() { document.getElementById('habitModal').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('habitModal')) closeModal(); }

// ── Navigation ──
function selectHabit(id) {
  activeId = id;
  closeSidebar();
  renderAll();
}

function setView(v, btn) {
  currentView = v;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderContent();
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebar() {
  if (window.innerWidth < 640) document.getElementById('sidebar').classList.remove('open');
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Date pill ──
function setDatePill() {
  const d = new Date();
  document.getElementById('datePill').textContent = d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}).toUpperCase();
}

// ── Init ──
function renderAll() {
  renderSidebar();
  renderContent();
}

setDatePill();

// Kick off cloud loading on mount
loadDataFromCloud();
</script>
